<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Sky Auto Player small icon</title>
  <desc id="desc">Optically tuned small-size version of the Sky Auto Player mark.</desc>

  <rect id="plate" x="0.25" y="0.25" width="127.5" height="127.5" rx="27.75" fill="#07090D" stroke="#1A222A" stroke-width="0.5"/>

  <!-- Slightly stronger small-size strokes and larger gaps preserve the rhythm at 16/24 px. -->
  <line id="edge-a-b" x1="40" y1="48" x2="40" y2="80" stroke="#F4EFE3" stroke-width="3" stroke-linecap="round"/>
  <line id="edge-a-c" x1="52.9904" y1="40.5" x2="82.8683" y2="57.75" stroke="#F4EFE3" stroke-width="3" stroke-linecap="round"/>
  <line id="dash-b-c-1" x1="55.5885" y1="86" x2="61.6506" y2="82.5" stroke="#F4EFE3" stroke-width="3" stroke-linecap="round"/>
  <line id="dash-b-c-2" x1="69.4449" y1="78" x2="75.5070" y2="74.5" stroke="#F4EFE3" stroke-width="3" stroke-linecap="round"/>

  <rect id="diamond-a" x="33" y="26" width="14" height="14" rx="0.75" transform="rotate(45 40 33)" fill="#F7DDA2" stroke="#F4EFE3" stroke-width="1.8"/>
  <circle id="node-b-gold" cx="40" cy="95" r="9.5" fill="#07090D" stroke="#F7DDA2" stroke-width="4"/>
  <circle id="node-c-sky" cx="93.6936" cy="64" r="8.5" fill="#07090D" stroke="#B8CCD6" stroke-width="3.3"/>
</svg>
