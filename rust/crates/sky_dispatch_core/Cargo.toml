[package]
name = "sky_dispatch_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = []

[dependencies]
thiserror = "2"
smallvec = { version = "1", features = ["union"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[[bench]]
name = "soak_benchmark"
harness = false

[[bench]]
name = "commit_scaling"
harness = false
