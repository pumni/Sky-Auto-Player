[package]
name = "sky_player_rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sky_player_rs"
# Keep both targets for the existing wheel and native integration tests.
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-support = ["sky_player/test-support"]
calibration = []

[dependencies]
sky_player = { path = "../sky_player" }
sky_dispatch_core = { path = "../sky_dispatch_core" }
sky_dispatch_win32 = { path = "../sky_dispatch_win32" }
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
smallvec = { version = "1", features = ["serde", "union"] }
serde_json = "1"
