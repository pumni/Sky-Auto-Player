[package]
name = "sky_player_rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sky_player_rs"
# `rlib` is included alongside `cdylib` so that integration tests under
# `tests/` can link to the crate.  The rlib target is unused in the release
# build (PyInstaller only picks up the cdylib); adding it here does not affect
# the production ABI in any way.
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-support = ["sky_dispatch_core/test-support", "sky_dispatch_win32/test-support"]
calibration = []

[dependencies]
sky_dispatch_core = { path = "../sky_dispatch_core" }
sky_dispatch_win32 = { path = "../sky_dispatch_win32" }
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
thiserror = "2"
smallvec = { version = "1", features = ["serde", "union"] }
crossbeam-queue = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sky_dispatch_core = { path = "../sky_dispatch_core", features = ["test-support"] }
sky_dispatch_win32 = { path = "../sky_dispatch_win32", features = ["test-support"] }

[[test]]
name = "rt_dispatch_no_alloc"
required-features = ["test-support"]

[[example]]
name = "rt_handoff_bench"
required-features = ["test-support"]
