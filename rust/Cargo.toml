[workspace]
resolver = "3"
members = [
    "crates/sky_dispatch_core",
    "crates/sky_dispatch_win32",
    "crates/sky_player_rs",
    "crates/sky_updater",
]

[workspace.package]
edition = "2024"
# Main tracks the explicitly pinned production compiler; release branches may
# freeze their own compiler and MSRV policy.
rust-version = "1.98"
authors = ["Sky Auto Player Team"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"
strip = "symbols"
overflow-checks = true
