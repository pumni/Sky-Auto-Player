[workspace]
resolver = "3"
members = [
    "crates/sky_dispatch_core",
    "crates/sky_dispatch_win32",
    "crates/sky_player_rs",
    "crates/sky_updater",
]

[workspace.package]
edition = "2024"
# MSRV is 1.97; the reproducible production compiler is pinned separately in
# rust-toolchain.toml. Do not describe this repository as Rust 1.98 stable.
rust-version = "1.97"
authors = ["Sky Auto Player Team"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"
strip = "symbols"
overflow-checks = true
