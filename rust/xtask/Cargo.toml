[package]
name = "sky_xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
pep440_rs = "0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9.12"
walkdir = "2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
