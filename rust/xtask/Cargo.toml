[package]
name = "sky_xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
getrandom = "0.4"
ico = "0.6"
minisign-verify = "=0.3.0"
roxmltree = "0.21.1"
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sky_app_core = { path = "../crates/sky_app_core" }
toml = "1.1.8"
url = "2.5.8"
walkdir = "2.5"
