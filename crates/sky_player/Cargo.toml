[package]
name = "sky_player"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sky_player"

[features]
default = []
test-support = ["sky_dispatch_core/test-support", "sky_dispatch_win32/test-support"]
real-input-acceptance = ["test-support"]
qpc-read-counting = ["sky_dispatch_win32/qpc-read-counting"]

[dependencies]
sky_dispatch_core.workspace = true
sky_dispatch_win32.workspace = true
thiserror.workspace = true
smallvec = { workspace = true, features = ["serde", "union"] }
crossbeam-queue = "0.3"
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
sky_app_core.workspace = true
sha2.workspace = true
sky_dispatch_core = { workspace = true, features = ["test-support"] }
sky_dispatch_win32 = { workspace = true, features = ["test-support"] }

[[test]]
name = "rt_dispatch_no_alloc"
required-features = ["test-support"]

[[bin]]
name = "rt-native-acceptance"
path = "src/bin/rt_native_acceptance.rs"
required-features = ["real-input-acceptance"]

[[example]]
name = "dispatch_lifecycle_evidence"
path = "examples/dispatch_lifecycle_evidence.rs"
required-features = ["test-support"]

[lints]
workspace = true
