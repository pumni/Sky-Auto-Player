# Merge into the repository's existing CI; do not copy blindly.
name: native-dispatch
on: [push, pull_request]

jobs:
  rust-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: cargo +1.97.1 fmt --all -- --check
        working-directory: rust
      - run: cargo +1.97.1 clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: rust
      - run: cargo +1.97.1 test --workspace --all-features
        working-directory: rust

  # Add the repo-standard uv + CPython 3.14t setup here, then build/install
  # the maturin wheel and run pytest/PyInstaller selftests.
