name: Website CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        # Version is pinned via site/package.json `packageManager` field (single source of truth).
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type and Astro checks
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Formatting
        run: bun run format:check

      - name: Build static site
        run: bun run build

      - name: Verify required output
        run: bun run verify:dist

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Run E2E and accessibility tests
        run: bun run test:e2e
        env:
          CI: true
