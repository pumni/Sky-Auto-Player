name: V4 Production Pre-Publication Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-release-control-plane
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  qualification-dispatch-boundary:
    name: Validate canonical production qualification context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail closed outside the canonical default branch
        shell: bash
        env:
          EXPECTED_REPOSITORY: pumni/Sky-Auto-Player
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "qualification requires workflow_dispatch" >&2; exit 1; }
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY" || { echo "qualification repository is not canonical" >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo "qualification must be dispatched from refs/heads/main" >&2; exit 1; }
          test "$EXPECTED_DEFAULT_BRANCH" = "main" || { echo "canonical repository default branch must be main" >&2; exit 1; }

  qualification:
    name: V4 production pre-publication qualification
    needs: qualification-dispatch-boundary
    if: needs.qualification-dispatch-boundary.result == 'success'
    runs-on: [self-hosted, windows, v4-release, single-tenant]
    environment: v4-production-release
    permissions:
      contents: read

    steps:
      - name: Initialize isolated qualification state root
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw "RUNNER_TEMP is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_RUN_ID)) { throw "GITHUB_RUN_ID is unavailable" }
          "V4_RELEASE_STATE_ROOT=$env:RUNNER_TEMP\sky-v4-release-$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the exact dispatched source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated production runner boundary
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify_v4_release_runner.ps1 `
            -UpdaterPrivateKeyPath $env:V4_UPDATER_PRIVATE_KEY_PATH `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Run canonical production Preflight without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State Preflight `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Run canonical production BuildCandidate and stop
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State BuildCandidate `
            -StateRoot $env:V4_RELEASE_STATE_ROOT `
            -UpdaterPrivateKeyPath $env:V4_UPDATER_PRIVATE_KEY_PATH

      - name: Preserve bounded qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v4-production-qualification-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\release-context.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-manifest.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-evidence\*.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\fixture-http-evidence.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\defender-evidence.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\preflight-evidence.json

      - name: Clean runner-local qualification state
        if: always()
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/cleanup_v4_release_state.ps1 `
            -StateRoot $env:V4_RELEASE_STATE_ROOT
