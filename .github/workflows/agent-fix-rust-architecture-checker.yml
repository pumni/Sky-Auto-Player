name: Agent fix Rust architecture checker

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/fix-missed-note-semantics

      - name: Repair canonical dispatch classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}")
              file_path.write_text(text.replace(old, new, count), encoding="utf-8")

          replace_exact(
              "scripts/check_rust_architecture.py",
              '''CANONICAL_DISPATCH_FILES = {\n    "authored.rs",\n    "mod.rs",\n    "observation.rs",\n    "observer.rs",\n    "timing.rs",\n}''',
              '''CANONICAL_DISPATCH_FILES = {\n    "authored.rs",\n    "mod.rs",\n    "observation.rs",\n    "observer.rs",\n    "recovery.rs",\n    "timing.rs",\n}''',
          )
          replace_exact(
              "scripts/check_rust_architecture.py",
              '''        actual_dispatch_files = {path.name for path in dispatch_dir.glob("*.rs")}''',
              '''        actual_dispatch_files = {\n            path.name\n            for path in dispatch_dir.glob("*.rs")\n            if not path.name.endswith("_tests.rs")\n        }''',
          )

          replace_exact(
              "tests/test_rust_architecture.py",
              '''CANONICAL_DISPATCH_FILES = {\n    "authored.rs",\n    "mod.rs",\n    "observation.rs",\n    "observer.rs",\n    "timing.rs",\n}''',
              '''CANONICAL_DISPATCH_FILES = {\n    "authored.rs",\n    "mod.rs",\n    "observation.rs",\n    "observer.rs",\n    "recovery.rs",\n    "timing.rs",\n}''',
          )
          replace_exact(
              "tests/test_rust_architecture.py",
              '''def test_checker_accepts_exact_canonical_dispatch_set(tmp_path):\n    _dispatch_fixture(tmp_path, CANONICAL_DISPATCH_FILES)\n    report = _checker().check_repository(tmp_path)\n    assert not report.errors\n\n\n''',
              '''def test_checker_accepts_exact_canonical_dispatch_set(tmp_path):\n    _dispatch_fixture(tmp_path, CANONICAL_DISPATCH_FILES)\n    report = _checker().check_repository(tmp_path)\n    assert not report.errors\n\n\ndef test_checker_ignores_dispatch_test_sidecars(tmp_path):\n    _dispatch_fixture(\n        tmp_path,\n        CANONICAL_DISPATCH_FILES | {"authored_tests.rs", "cutoff_tests.rs"},\n    )\n    report = _checker().check_repository(tmp_path)\n    assert not any(\n        item.rule in {"unexpected_dispatch_module", "missing_dispatch_module"}\n        for item in report.errors\n    )\n\n\n''',
          )
          PY

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "false"

      - name: Validate checker repair
        shell: bash
        run: |
          uv run ruff check scripts/check_rust_architecture.py tests/test_rust_architecture.py
          uv run pyright scripts/check_rust_architecture.py tests/test_rust_architecture.py
          uv run pytest tests/test_rust_architecture.py -q

      - name: Commit checker repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check_rust_architecture.py tests/test_rust_architecture.py
          git diff --cached --check
          git commit -m "fix(ci): align Rust architecture checker with current dispatch tree"
          git push origin HEAD:agent/fix-missed-note-semantics
