name: V4 Release Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-release-control-plane
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release-dispatch-boundary:
    name: Validate canonical production dispatch context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail closed outside the canonical default branch
        shell: bash
        env:
          EXPECTED_REPOSITORY: pumni/Sky-Auto-Player
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "release requires workflow_dispatch" >&2; exit 1; }
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY" || { echo "release repository is not canonical" >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo "release must be dispatched from refs/heads/main" >&2; exit 1; }
          test "$EXPECTED_DEFAULT_BRANCH" = "main" || { echo "canonical repository default branch must be main" >&2; exit 1; }

      - name: Require exact-head production qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW: .github/workflows/rehearse-v4.yml
        run: |
          set -euo pipefail
          qualified_run="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$EXPECTED_WORKFLOW/runs?event=workflow_dispatch&status=completed&head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == env.GITHUB_SHA and .name == "V4 Production Pre-Publication Qualification") | .id' | head -n 1)"
          test -n "$qualified_run" || {
            echo "no successful exact-head production qualification exists for $GITHUB_SHA" >&2
            exit 1
          }
          echo "accepted exact-head production qualification run $qualified_run for $GITHUB_SHA"

  release:
    name: V4 production release state machine
    needs: release-dispatch-boundary
    if: needs.release-dispatch-boundary.result == 'success'
    # This label set is intentionally narrower than a general Windows pool.
    # It identifies the accepted dedicated/single-tenant release runner.
    runs-on: [self-hosted, windows, v4-release, single-tenant]
    environment: v4-production-release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Initialize release state root
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw "RUNNER_TEMP is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_RUN_ID)) { throw "GITHUB_RUN_ID is unavailable" }
          "V4_RELEASE_STATE_ROOT=$env:RUNNER_TEMP\sky-v4-release-$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the exact requested source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated production runner boundary
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify_v4_release_runner.ps1 `
            -UpdaterPrivateKeyPath $env:V4_UPDATER_PRIVATE_KEY_PATH `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Preflight release request and repository readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State Preflight `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Build and qualify the single production candidate
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State BuildCandidate `
            -StateRoot $env:V4_RELEASE_STATE_ROOT `
            -UpdaterPrivateKeyPath $env:V4_UPDATER_PRIVATE_KEY_PATH

      - name: Preserve bounded qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v4-qualification-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-manifest.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-evidence\*.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\fixture-http-evidence.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\defender-evidence.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\preflight-evidence.json

      - name: Attest exact candidate and signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-bundle\*.exe
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-bundle\*.sig

      - name: Attest SPDX SBOM for exact candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-bundle\*.exe
          sbom-path: ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\candidate-evidence\SBOM.spdx.json

      - name: Verify exact-source OIDC attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gh = (Get-Command gh.exe -CommandType Application -ErrorAction Stop).Source
          $assetsDir = Join-Path $env:V4_RELEASE_STATE_ROOT "candidate-bundle"
          $installer = @(Get-ChildItem -LiteralPath $assetsDir -Filter "*.exe" -File)
          $signature = @(Get-ChildItem -LiteralPath $assetsDir -Filter "*.sig" -File)
          if ($installer.Count -ne 1 -or $signature.Count -ne 1) { throw "Attestation subject set is not exact" }
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/release-v4.yml"
          & $gh attestation verify $installer[0].FullName -R $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "Installer exact-source attestation verification failed" }
          & $gh attestation verify $signature[0].FullName -R $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "Updater signature exact-source attestation verification failed" }
          & $gh attestation verify $installer[0].FullName -R $env:GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3 --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "SBOM exact-source attestation verification failed" }

      - name: Mint release-metadata GitHub App token before publication
        id: metadata-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v1.11.0
        with:
          client-id: ${{ vars.V4_RELEASE_METADATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.V4_RELEASE_METADATA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Probe release-metadata App access before publication
        env:
          GH_TOKEN: ${{ steps.metadata-app-token.outputs.token }}
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/probe_v4_metadata_app_access.ps1

      - name: Publish the qualified candidate immutably
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State PublishRelease `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Promote release metadata only after immutable publication
        env:
          GH_TOKEN: ${{ steps.metadata-app-token.outputs.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State PromoteMetadata `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Re-fetch and verify final public release and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State FinalVerify `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Clean runner-local release state
        if: always()
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/cleanup_v4_release_state.ps1 `
            -StateRoot $env:V4_RELEASE_STATE_ROOT
