name: V4 Release Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-release-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release-dispatch-boundary:
    name: Validate canonical production dispatch context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail closed outside the canonical default branch
        shell: bash
        env:
          EXPECTED_REPOSITORY: pumni/Sky-Auto-Player
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "release requires workflow_dispatch" >&2; exit 1; }
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY" || { echo "release repository is not canonical" >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo "release must be dispatched from refs/heads/main" >&2; exit 1; }
          test "$EXPECTED_DEFAULT_BRANCH" = "main" || { echo "canonical repository default branch must be main" >&2; exit 1; }

  release:
    name: V4 production release state machine
    needs: release-dispatch-boundary
    if: needs.release-dispatch-boundary.result == 'success'
    # This label set is intentionally narrower than a general Windows pool.
    # It identifies the accepted dedicated/single-tenant release runner.
    runs-on: [self-hosted, windows, v4-release, single-tenant]
    environment: v4-production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      V4_RELEASE_WORKFLOW_SHA: ${{ github.sha }}

    steps:
      - name: Initialize release state root
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) { throw "RUNNER_TEMP is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_RUN_ID)) { throw "GITHUB_RUN_ID is unavailable" }
          "V4_RELEASE_STATE_ROOT=$env:RUNNER_TEMP\sky-v4-release-$env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the exact requested source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Derive exact release identity from checked-out source
        run: |
          $sourceSha = $env:GITHUB_SHA
          if ($sourceSha -notmatch '^[0-9a-fA-F]{40}$') { throw "GITHUB_SHA is not an exact commit SHA" }
          $cargo = Get-Content -LiteralPath "desktop/src-tauri/Cargo.toml" -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Cargo package version is missing" }
          $version = $Matches[1]
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Cargo package version is not canonical v4 SemVer without build metadata"
          }
          $channel = if ($version.Contains("-")) { "beta" } else { "stable" }
          $tag = "v$version"
          $notesPath = "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw "release notes are missing: $notesPath" }
          @(
            "V4_RELEASE_SOURCE_SHA=$sourceSha",
            "V4_RELEASE_VERSION=$version",
            "V4_RELEASE_CHANNEL=$channel",
            "V4_RELEASE_TAG=$tag",
            "V4_RELEASE_NOTES_PATH=$notesPath"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Derived v4 release identity: version=$version channel=$channel tag=$tag source=$sourceSha notes=$notesPath"

      - name: Verify isolated production runner boundary
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify_v4_release_runner.ps1 `
            -UpdaterPrivateKeyPath $env:V4_UPDATER_PRIVATE_KEY_PATH `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Validate exact v4 release request
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State ValidateRequest `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT `
            -ReleaseNotesPath $env:V4_RELEASE_NOTES_PATH

      - name: Verify canonical repository release policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State ValidateRepository `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT `
            -ReleaseNotesPath $env:V4_RELEASE_NOTES_PATH

      - name: Verify dedicated runner tools
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,gh.exe

      - name: Build and qualify the single production candidate
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State BuildCandidate `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT `
            -UpdaterPrivateKeyPath $env:V4_UPDATER_PRIVATE_KEY_PATH

      - name: Create exact candidate draft in canonical repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State CreateDraft `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT `
            -ReleaseNotesPath $env:V4_RELEASE_NOTES_PATH

      - name: Re-download exact draft assets from canonical repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State DownloadDraft `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Qualify downloaded exact candidate bytes and packaged update
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State QualifyDownloaded `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Preserve bounded post-draft qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v4-post-draft-qualification-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\post-draft-qualification.json
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\defender-evidence.json

      - name: Attest exact downloaded Tauri candidate and signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\downloaded\*.exe
            ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\downloaded\*.sig

      - name: Attest SPDX SBOM for exact downloaded candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\downloaded\*.exe
          sbom-path: ${{ runner.temp }}\sky-v4-release-${{ github.run_id }}\downloaded\SBOM.spdx.json

      - name: Verify exact-source OIDC attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $gh = (Get-Command gh.exe -CommandType Application -ErrorAction Stop).Source
          $downloaded = Join-Path $env:V4_RELEASE_STATE_ROOT "downloaded"
          $installer = @(Get-ChildItem -LiteralPath $downloaded -Filter "*.exe" -File)
          $signature = @(Get-ChildItem -LiteralPath $downloaded -Filter "*.sig" -File)
          if ($installer.Count -ne 1 -or $signature.Count -ne 1) { throw "Downloaded attestation subject set is not exact" }
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/release-v4.yml"
          & $gh attestation verify $installer[0].FullName -R $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "Installer exact-source attestation verification failed" }
          & $gh attestation verify $signature[0].FullName -R $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "Updater signature exact-source attestation verification failed" }
          & $gh attestation verify $installer[0].FullName -R $env:GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3 --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "SBOM exact-source attestation verification failed" }

      - name: Record verified exact-byte attestations
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State RecordAttestations `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Snapshot GitHub Latest before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/ci_v4_release_latest_guard.ps1 -Mode Capture -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Publish the already-qualified draft immutably
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State PublishDraft `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Verify GitHub Latest channel policy before metadata promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/ci_v4_release_latest_guard.ps1 `
          -Mode Verify `
          -Channel $env:V4_RELEASE_CHANNEL `
          -ExpectedTag $env:V4_RELEASE_TAG `
          -ExpectedSourceSha $env:V4_RELEASE_SOURCE_SHA `
          -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Mint release-metadata GitHub App token
        id: metadata-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.V4_RELEASE_METADATA_APP_ID }}
          private-key: ${{ secrets.V4_RELEASE_METADATA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Promote release metadata only after immutable publication
        env:
          GH_TOKEN: ${{ steps.metadata-app-token.outputs.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State PromoteMetadata `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT `
            -ReleaseNotesPath $env:V4_RELEASE_NOTES_PATH

      - name: Re-fetch and verify final public release and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/v4_release_pipeline.ps1 `
            -State FinalVerify `
            -Version $env:V4_RELEASE_VERSION `
            -Channel $env:V4_RELEASE_CHANNEL `
            -Tag $env:V4_RELEASE_TAG `
            -SourceSha $env:V4_RELEASE_SOURCE_SHA `
            -WorkflowSha $env:V4_RELEASE_WORKFLOW_SHA `
            -StateRoot $env:V4_RELEASE_STATE_ROOT

      - name: Clean runner-local release state
        if: always()
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/cleanup_v4_release_state.ps1 `
            -StateRoot $env:V4_RELEASE_STATE_ROOT
