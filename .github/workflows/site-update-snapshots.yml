name: Update site e2e snapshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          `failing` regenerates only mismatched baselines (default).
          `all` regenerates every baseline.
        required: false
        default: failing
        type: choice
        options:
          - failing
          - all
      grep:
        description: >-
          Optional Playwright `-g` title grep (e.g. `home-en-desktop-1440`).
          Empty runs every e2e test.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: site-update-snapshots
  cancel-in-progress: false

jobs:
  update:
    name: Regenerate Playwright baselines (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Bun
        # Version is pinned via site/package.json `packageManager` (single source of truth).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        shell: bash
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build static site
        shell: bash
        working-directory: site
        run: bun run build

      - name: Install Playwright Chromium
        shell: bash
        working-directory: site
        run: bunx playwright install chromium --with-deps

      - name: Regenerate baselines
        shell: bash
        working-directory: site
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.mode }}" = "all" ]; then
            args+=("--update-snapshots=all")
          else
            args+=("--update-snapshots")
          fi
          if [ -n "${{ inputs.grep }}" ]; then
            args+=("-g" "${{ inputs.grep }}")
          fi
          bun run test:visual -- "${args[@]}"

      - name: Verify baselines (clean run, no updates)
        shell: bash
        working-directory: site
        env:
          CI: 'true'
        run: bun run test:visual

      - name: Commit regenerated linux baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'site/tests/e2e/visual.spec.ts-snapshots/*-chromium-linux.png' || true
          if git diff --cached --quiet; then
            echo "No linux baseline changes to commit."
            exit 0
          fi
          git commit -m "chore(site): refresh linux e2e visual baselines"
          git push

      - name: Trigger Pages deploy
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push from the default GITHUB_TOKEN does not trigger downstream
          # workflows (GitHub prevents loops), so dispatch pages.yml explicitly.
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
