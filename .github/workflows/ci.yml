name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual validation runs all relevant gates."
            exit 0
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$CURRENT_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              # Winget is not currently supported; no manifest validation is run.
              src/*|tests/*|scripts/*|rust/*|desktop/*|.cargo/*|.github/workflows/*|.github/actions/*|.github/ISSUE_TEMPLATE/*)
                relevant=true
                break
                ;;
              pyproject.toml|uv.lock|.python-version|.env.example|Sky-Auto-Player.spec|Sky-Auto-Player-Core.spec)
                relevant=true
                break
                ;;
              windows_version_info.txt|AGENTS.md|CLAUDE.md|CONTRIBUTING.md|SECURITY.md|docs/INDEX.md|docs/README.md|.github/PULL_REQUEST_TEMPLATE.md|.config/security_audit_baseline.json|.config/rust_architecture_allowlist.json)
                relevant=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant validation changes: $relevant"

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "false"

      - name: Python dependency audit
        run: uv audit --frozen

      - name: RustSec dependency audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo audit --file rust/Cargo.lock

      - name: Repository verification — static
        run: uv run python scripts/check.py static

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Rust — install pinned stable toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify pinned stable toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 from rust/rust-toolchain.toml, got: $version"
          }

      - name: Rust — build wheel
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          SKY_EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --env-file .env python scripts/build_rust_wheel.py --test-support

      - name: Repository verification — Rust
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: uv run python scripts/check.py rust

      - name: Repository verification — Python tests
        # Run windows-marked tests when present; skip only wall-clock `slow`.
        run: uv run python scripts/check.py tests

      - name: Set up Bun for desktop verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install Chromium for desktop browser smoke
        working-directory: desktop
        run: bunx playwright install chromium

      - name: Repository verification — desktop
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: uv run python scripts/check.py desktop

  packaged:
    name: Packaged frozen unsigned app smoke
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Rust — install pinned stable toolchain for packaged build
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify packaged-build compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for packaged build, got: $version"
          }

      - name: Build source PyInstaller bootloader
        run: |
          $bootloader = Join-Path $env:RUNNER_TEMP "sky-auto-player-pyinstaller-bootloader"
          pwsh -NoProfile -File scripts/build_pyinstaller_bootloader.ps1 -OutputDirectory $bootloader
          "SKY_SOURCE_BOOTLOADER_DIR=$bootloader" | Add-Content $env:GITHUB_ENV -Encoding ASCII
          "SKY_REQUIRE_SOURCE_BOOTLOADER=1" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Set up Bun for production frontend build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Build and qualify exact Phase 8 portable artifact
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          SKY_EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Sky Auto Player Phase8"
          uv run --env-file .env python scripts/build_phase8.py --output-root $output
          "SKY_PHASE8_OUTPUT=$output" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Verify packaged release tree
        run: |
          $version = uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          uv run --env-file .env python scripts/verify_release_manifest.py `
            --release-dir (Join-Path $env:SKY_PHASE8_OUTPUT "Sky-Auto-Player-v$version") --version $version

      - name: Upload exact Phase 8 release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sky-auto-player-phase8-portable-v${{ hashFiles('pyproject.toml') }}
          path: ${{ runner.temp }}/Sky Auto Player Phase8
          if-no-files-found: error
          retention-days: 14

  status:
    name: Sky Auto Player — required CI gate
    if: always()
    needs: [changes, static, validate, packaged]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGED_RESULT: ${{ needs.packaged.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" || "$STATIC_RESULT" == "skipped" ]]
          [[ "$VALIDATE_RESULT" == "success" || "$VALIDATE_RESULT" == "skipped" ]]
          [[ "$PACKAGED_RESULT" == "success" || "$PACKAGED_RESULT" == "skipped" ]]
          echo "CI status is green."
