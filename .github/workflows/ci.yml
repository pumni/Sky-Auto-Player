name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$CURRENT_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              # manifests/* intentionally omitted: winget channel is deferred
              # and has no CI gate yet (placeholder SHA only).
              src/*|tests/*|scripts/*|installer/*|rust/*|.github/workflows/*|.github/actions/*)
                relevant=true
                break
                ;;
              pyproject.toml|uv.lock|.python-version|.env.example|Sky-Auto-Player.spec)
                relevant=true
                break
                ;;
              windows_version_info.txt|updater.bat|AGENTS.md|SECURITY.md|.config/security_audit_baseline.json)
                relevant=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant validation changes: $relevant"

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "false"

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Types — pyright
        run: uv run pyright

      - name: Security — AGENTS.md P0 audit
        run: uv run --env-file .env python scripts/audit_security_mandates.py

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Updater — UTF-8 BOM + Windows PowerShell 5.1 parse
        uses: ./.github/actions/updater-ps51-gate

      - name: Rust — format, lint, tests, and native wheel
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features
          uv run --env-file .env python scripts/build_rust_wheel.py

      - name: Pester — installer tests
        uses: ./.github/actions/run-pester

      - name: Tests — unit (skip slow benchmarks)
        # Run windows-marked tests when present; skip only wall-clock `slow`.
        run: uv run pytest -m "not slow"

      - name: Benchmark — native sender-side acceptance smoke
        # Mock backend only: records host-side timing evidence without sending
        # input to a game or another process.
        run: uv run --env-file .env python scripts/bench_native_acceptance.py --actions 512 --repeats 3 --label ci

  status:
    name: Sky Auto Player — full altitude gate
    if: always()
    needs: [changes, static, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" || "$STATIC_RESULT" == "skipped" ]]
          [[ "$VALIDATE_RESULT" == "success" || "$VALIDATE_RESULT" == "skipped" ]]
          echo "CI status is green."
