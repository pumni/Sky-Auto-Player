name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual validation runs all relevant gates."
            exit 0
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$CURRENT_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              # manifests/* intentionally omitted: winget channel is deferred
              # and has no CI gate yet (placeholder SHA only).
              src/*|tests/*|scripts/*|rust/*|.github/workflows/*|.github/actions/*)
                relevant=true
                break
                ;;
              pyproject.toml|uv.lock|.python-version|.env.example|Sky-Auto-Player.spec)
                relevant=true
                break
                ;;
              windows_version_info.txt|AGENTS.md|SECURITY.md|.config/security_audit_baseline.json)
                relevant=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant validation changes: $relevant"

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "false"

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Types — pyright
        run: uv run pyright

      - name: Security — AGENTS.md P0 audit
        run: uv run --env-file .env python scripts/audit_security_mandates.py

      - name: Rust architecture — enforced boundaries
        run: uv run python scripts/check_rust_architecture.py --enforce

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Rust — format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust — check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features

      - name: Rust — clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Rust — unit tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-features

      - name: Rust — build wheel
        env:
          SKY_EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --env-file .env python scripts/build_rust_wheel.py --test-support

      - name: Tests — unit (skip slow benchmarks)
        # Run windows-marked tests when present; skip only wall-clock `slow`.
        run: uv run pytest -m "not slow"

  packaged:
    name: Packaged frozen unsigned app smoke
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Build source PyInstaller bootloader
        run: |
          $bootloader = Join-Path $env:RUNNER_TEMP "sky-auto-player-pyinstaller-bootloader"
          pwsh -NoProfile -File scripts/build_pyinstaller_bootloader.ps1 -OutputDirectory $bootloader
          "SKY_SOURCE_BOOTLOADER_DIR=$bootloader" | Add-Content $env:GITHUB_ENV -Encoding ASCII
          "SKY_REQUIRE_SOURCE_BOOTLOADER=1" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Build packaged unsigned app
        env:
          SKY_EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --env-file .env python -m build_app --manifest

      - name: Verify packaged release tree
        run: |
          $version = uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          uv run --env-file .env python scripts/verify_release_manifest.py `
            --release-dir "dist\Sky-Auto-Player-v$version" --version $version

      - name: Native updater security E2E
        run: cargo test --manifest-path rust/Cargo.toml -p sky_updater --test packaged_update_e2e --all-features


  status:
    name: Sky Auto Player — full altitude gate
    if: always()
    needs: [changes, static, validate, packaged]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGED_RESULT: ${{ needs.packaged.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" || "$STATIC_RESULT" == "skipped" ]]
          [[ "$VALIDATE_RESULT" == "success" || "$VALIDATE_RESULT" == "skipped" ]]
          [[ "$PACKAGED_RESULT" == "success" || "$PACKAGED_RESULT" == "skipped" ]]
          echo "CI status is green."
