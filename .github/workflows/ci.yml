name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$CURRENT_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              src/*|tests/*|scripts/*|installer/*|manifests/*|.github/workflows/*|.github/actions/*)
                relevant=true
                break
                ;;
              pyproject.toml|uv.lock|.python-version|.env.example|Sky-Auto-Player.spec)
                relevant=true
                break
                ;;
              windows_version_info.txt|updater.bat|AGENTS.md|SECURITY.md|.config/security_audit_baseline.json)
                relevant=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant validation changes: $relevant"

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "false"

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Types — pyright
        run: uv run pyright

      - name: Security — AGENTS.md P0 audit
        run: uv run --env-file .env python scripts/audit_security_mandates.py

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Parse installer/updater.ps1 on Windows PowerShell 5.1
        shell: powershell
        run: |
          # updater.bat falls back to powershell.exe (Windows PowerShell 5.1)
          # when pwsh is not installed on the user's machine. PS 5.1 reads
          # no-BOM .ps1 files with the system ANSI codepage (Windows-1252
          # on en-US hosts), so non-ASCII bytes (em-dash --, S-section
          # sign) get decoded as a corrupted sequence and break the
          # parser. This step fails-fast if the file cannot be parsed
          # by PS 5.1, preventing a regression of the bug that closed
          # 2.4.1 (file carried non-ASCII comments without a UTF-8 BOM,
          # broke external updates on any install without PS7). Runs on
          # the GitHub Windows runner which always has PS 5.1 available
          # side-by-side with pwsh.
          # Keep this inline script ASCII-only: GitHub Actions writes the
          # run: block to a temp .ps1 without a BOM, so PS 5.1 would
          # mis-decode any non-ASCII byte here the same way.
          $errs = $null; $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\installer\updater.ps1", [ref]$tokens, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            Write-Host "::error::installer/updater.ps1 fails to parse on Windows PowerShell 5.1 ($($errs.Count) error(s)). updater.bat falls back to PS 5.1 when pwsh is absent; the external update path is broken. Likely cause: file lacks UTF-8 BOM and contains non-ASCII characters decoded wrong by the system ANSI codepage."
            $errs | ForEach-Object {
              Write-Host ("  line {0} col {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            exit 1
          }
          Write-Host "PS 5.1 parse OK -- external updater remains compatible with updater.bat PS 5.1 fallback."

      - name: Tests — unit (scheduler, parser, domain — no Windows required)
        run: uv run pytest -m "not windows and not slow"

  status:
    name: Sky Auto Player — full altitude gate
    if: always()
    needs: [changes, static, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" || "$STATIC_RESULT" == "skipped" ]]
          [[ "$VALIDATE_RESULT" == "success" || "$VALIDATE_RESULT" == "skipped" ]]
          echo "CI status is green."
