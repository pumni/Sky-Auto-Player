name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact baseline commit SHA
        required: true
        type: string
      performance_scope:
        description: Performance gate scope
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual validation runs all relevant gates."
            exit 0
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$CURRENT_SHA")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              # manifests/* intentionally omitted: winget channel is deferred
              # and has no CI gate yet (placeholder SHA only).
              src/*|tests/*|scripts/*|installer/*|rust/*|.github/workflows/*|.github/actions/*)
                relevant=true
                break
                ;;
              pyproject.toml|uv.lock|.python-version|.env.example|Sky-Auto-Player.spec)
                relevant=true
                break
                ;;
              windows_version_info.txt|updater.bat|AGENTS.md|SECURITY.md|.config/security_audit_baseline.json)
                relevant=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Relevant validation changes: $relevant"

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "false"

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Types — pyright
        run: uv run pyright

      - name: Rust architecture — enforced boundaries
        run: uv run python scripts/check_rust_architecture.py --enforce

      - name: Security — AGENTS.md P0 audit
        run: uv run --env-file .env python scripts/audit_security_mandates.py

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Updater — UTF-8 BOM + Windows PowerShell 5.1 parse
        uses: ./.github/actions/updater-ps51-gate

      - name: Rust — format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust — check
        run: cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features

      - name: Rust — clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Rust — unit tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace --all-features

      - name: Rust — build wheel
        env:
          SKY_EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --env-file .env python scripts/build_rust_wheel.py --test-support


      - name: Pester — installer tests
        uses: ./.github/actions/run-pester

      - name: Tests — unit (skip slow benchmarks)
        # Run windows-marked tests when present; skip only wall-clock `slow`.
        run: uv run pytest -m "not slow"

      - name: Benchmark — same-runner native A/B regression gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MANUAL_BASELINE_SHA: ${{ inputs.baseline_sha }}
          PERFORMANCE_SCOPE: ${{ inputs.performance_scope }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'sky-native-ab-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          if ($env:EVENT_NAME -eq 'pull_request') {
            $baseline = $env:PR_BASE_SHA
          } elseif ($env:EVENT_NAME -eq 'push') {
            $baseline = $env:EVENT_BEFORE
          } else {
            $baseline = $env:MANUAL_BASELINE_SHA
          }

          $allZero = $baseline -match '^0+$'
          if ($allZero) {
            'baseline_comparison=unavailable_initial_push' | Set-Content (Join-Path $artifactRoot 'baseline-status.txt')
            uv run --env-file .env python scripts/bench_native_acceptance.py --actions 256 --dispatch-repeats 3 --command-samples 100 --polyphony 1,2,3,5,8,15 --lead-mode fixed --fixed-lead-us 0 --gap-profile hot --warmup-cycles 8 --rt-priority-mode off --label ci-smoke --output (Join-Path $artifactRoot 'candidate.json')
            exit $LASTEXITCODE
          }
          if ([string]::IsNullOrWhiteSpace($baseline)) {
            throw 'baseline SHA is required for this event'
          }
          if ($env:EVENT_NAME -eq 'pull_request' -and $baseline -ne '9ef9e5785c746ff45678a8a4cc5b9b6d66ede466') {
            throw "PR same-semantics baseline must be 9ef9e5785c746ff45678a8a4cc5b9b6d66ede466; got $baseline"
          }

          $matrices = @(
            @{ Name = 'fixed-hot-60'; Fps = 60; Actions = 512; Repeats = 10; Commands = 500; Lead = 'fixed'; Gap = 'hot'; Priority = 'off' },
            @{ Name = 'adaptive-hot-60'; Fps = 60; Actions = 512; Repeats = 10; Commands = 0; Lead = 'adaptive'; Gap = 'hot'; Priority = 'auto' },
            @{ Name = 'adaptive-cold-60'; Fps = 60; Actions = 64; Repeats = 10; Commands = 0; Lead = 'adaptive'; Gap = 'cold'; Priority = 'auto' },
            @{ Name = 'adaptive-hot-144'; Fps = 144; Actions = 512; Repeats = 10; Commands = 0; Lead = 'adaptive'; Gap = 'hot'; Priority = 'auto' },
            @{ Name = 'adaptive-cold-144'; Fps = 144; Actions = 64; Repeats = 10; Commands = 0; Lead = 'adaptive'; Gap = 'cold'; Priority = 'auto' }
          )
          foreach ($matrix in $matrices) {
            $matrixDir = Join-Path $artifactRoot $matrix.Name
            New-Item -ItemType Directory -Force -Path $matrixDir | Out-Null
            uv run --env-file .env python scripts/bench_native_ab.py --baseline-ref $baseline --candidate-ref $env:CURRENT_SHA --actions $matrix.Actions --dispatch-repeats $matrix.Repeats --command-samples $matrix.Commands --polyphony 1,2,3,5,8,15 --game-fps $matrix.Fps --lead-mode $matrix.Lead --fixed-lead-us 0 --gap-profile $matrix.Gap --warmup-cycles 8 --rt-priority-mode $matrix.Priority --budget-seconds 120 --output-dir $matrixDir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify native A/B artifact files before upload
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'sky-native-ab-artifacts'
          if (-not (Test-Path -LiteralPath $artifactRoot -PathType Container)) {
            throw "Native A/B artifact directory is missing: $artifactRoot"
          }
          $files = @(Get-ChildItem -LiteralPath $artifactRoot -File -Recurse)
          if ($files.Count -eq 0) {
            throw 'Native A/B artifact directory contains no files'
          }
          $size = ($files | Measure-Object -Property Length -Sum).Sum
          if ($size -le 0) {
            throw 'Native A/B artifact files have zero total size'
          }
          "artifact_files=$($files.Count) artifact_size_bytes=$size"

      - name: Upload native A/B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ab-${{ github.run_id }}
          path: ${{ runner.temp }}/sky-native-ab-artifacts
          if-no-files-found: error

  status:
    name: Sky Auto Player — full altitude gate
    if: always()
    needs: [changes, static, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" || "$STATIC_RESULT" == "skipped" ]]
          [[ "$VALIDATE_RESULT" == "success" || "$VALIDATE_RESULT" == "skipped" ]]
          echo "CI status is green."
