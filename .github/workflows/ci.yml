name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Classify validation layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      rust_required: ${{ steps.classify.outputs.rust_required }}
      desktop_required: ${{ steps.classify.outputs.desktop_required }}
      desktop_e2e_required: ${{ steps.classify.outputs.desktop_e2e_required }}
      package_required: ${{ steps.classify.outputs.package_required }}
      updater_required: ${{ steps.classify.outputs.updater_required }}
      release_required: ${{ steps.classify.outputs.release_required }}
      supply_chain_required: ${{ steps.classify.outputs.supply_chain_required }}
      site_required: ${{ steps.classify.outputs.site_required }}
      classification_reason: ${{ steps.classify.outputs.classification_reason }}
      # static_required is an internal CI projection, not a classifier output.
      static_required: ${{ steps.classify.outputs.rust_required == 'true' || steps.classify.outputs.desktop_required == 'true' || steps.classify.outputs.package_required == 'true' || steps.classify.outputs.updater_required == 'true' || steps.classify.outputs.release_required == 'true' || contains(steps.classify.outputs.classification_reason, 'static-only') }}

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_CHANGES=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout source for path classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths
        id: classify
        run: |
          set -euo pipefail
          classifier_args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            classifier_args+=(-Full)
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            classifier_args+=(-BaseSha "${{ github.event.pull_request.base.sha }}" -HeadSha "${{ github.event.pull_request.head.sha }}")
          else
            classifier_args+=(-BaseSha "${{ github.event.before }}" -HeadSha "${{ github.sha }}")
          fi
          classification="$(pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/ci_classify.ps1 "${classifier_args[@]}")"
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$classification"
          {
            echo '## Validation classification'
            echo '```text'
            printf '%s\n' "$classification"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_CHANGES:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`changes\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  updater_bridge:
    name: Build updater bridge fixture
    needs: changes
    if: needs.changes.outputs.updater_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1
      SKY_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_UPDATER_BRIDGE=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain for updater bridge
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Bun for updater bridge
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Fail fast on updater bridge dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx,sccache

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build pinned desktop frontend for updater bridge
        working-directory: desktop
        run: bun run build

      - name: Build exactly one updater bridge fixture
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $bridgeRoot = Join-Path $env:RUNNER_TEMP "sky-auto-player-updater-bridge"
          $bridgeTarget = Join-Path $env:RUNNER_TEMP "sky-auto-player-updater-bridge-target"
          pwsh scripts/ci_build_updater_bridge.ps1 `
            -OutputRoot $bridgeRoot `
            -TargetRoot $bridgeTarget `
            -SourceSha $env:SKY_CI_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Updater bridge producer failed with exit code $LASTEXITCODE" }
          $metadata = Get-Content -LiteralPath (Join-Path $bridgeRoot "bridge.json") -Raw | ConvertFrom-Json
          "SKY_BRIDGE_INSTALLER_SHA256=$($metadata.installer_sha256)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_VERSION=$($metadata.version)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_SENTINEL_ID=$($metadata.sentinel_id)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_SENTINEL_SHA256=$($metadata.sentinel_content_sha256)" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Confirm exact updater bridge artifact contents
        run: |
          $bridgeRoot = Join-Path $env:RUNNER_TEMP "sky-auto-player-updater-bridge"
          pwsh scripts/ci_validate_bridge.ps1 `
            -Mode Validate `
            -BridgeRoot $bridgeRoot `
            -SourceSha $env:SKY_CI_SOURCE_SHA `
            -Version $env:SKY_BRIDGE_VERSION `
            -SentinelId $env:SKY_BRIDGE_SENTINEL_ID `
            -SentinelContentSha256 $env:SKY_BRIDGE_SENTINEL_SHA256

      - name: Upload exact updater bridge contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sky-auto-player-updater-bridge-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sky-auto-player-updater-bridge
          if-no-files-found: error
          retention-days: 14

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job updater-bridge -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  updater_contract:
    name: Updater key-rotation contract
    needs: changes
    if: needs.changes.outputs.updater_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.0

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_UPDATER_CONTRACT=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain for updater contract
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc

      - name: Set up Bun for updater contract
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Fail fast on updater contract dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Exercise non-production updater key rotation fixture
        run: pwsh scripts/test_v4_updater_key_rotation.ps1

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job updater-contract

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.static_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_STATIC=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run CI classifier self-tests
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_ci_classify.ps1

      - name: Run current-candidate contract self-tests
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_ci_validate_candidate.ps1

      - name: Run updater-bridge contract self-tests
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_ci_validate_bridge.ps1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Repository verification — static
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check static --skip-supply-chain

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_STATIC:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`static\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release_contract:
    name: V4 release contract acceptance
    needs: changes
    if: needs.changes.outputs.release_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_RELEASE_CONTRACT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned toolchain for release contract tests
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Set up Bun for release contract tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Verify release contract test tools
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx,signtool.exe

      - name: Install pinned desktop dependencies for release contract tests
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Read-only GitHub Latest baseline guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh scripts/ci_v4_release_latest_guard.ps1

      - name: Promotion digest regression self-test
        run: pwsh scripts/promote_v4_metadata.ps1 -SelfTest

      - name: V4 release pipeline mock state-machine self-test
        run: pwsh scripts/test_v4_release_pipeline.ps1

      - name: Run V4 production release orchestrator contract test
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_v4_production_orchestrator.ps1

      - name: Run V4 updater private-key verifier secret-output regression
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_v4_updater_private_key.ps1

      - name: Prepare bounded ephemeral Authenticode test certificate
        timeout-minutes: 2
        shell: pwsh
        run: pwsh scripts/setup_v4_test_signing.ps1 -EnvFile $env:GITHUB_ENV -TimeoutSeconds 30

      - name: Build bounded unsigned Authenticode PE fixture
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "sky-v4-authenticode-unsigned-fixture"
          if (Test-Path -LiteralPath $fixtureRoot) {
            Remove-Item -LiteralPath $fixtureRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $fixtureRoot -Force | Out-Null
          $source = Join-Path $fixtureRoot "main.rs"
          $binary = Join-Path $fixtureRoot "sky-v4-authenticode-unsigned-fixture.exe"
          Set-Content -LiteralPath $source -Value "fn main() {}" -Encoding utf8
          rustc --edition 2021 --target x86_64-pc-windows-msvc --crate-name sky_v4_authenticode_unsigned -o $binary $source
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust compiler failed to create the Authenticode fixture (exit $LASTEXITCODE)" }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Pinned Rust compiler did not create the expected PE fixture: $binary" }
          $signature = Get-AuthenticodeSignature -LiteralPath $binary
          if ([string]$signature.Status -ne "NotSigned") {
            throw "Controlled Authenticode fixture must start unsigned; observed status: $($signature.Status)"
          }
          "SKY_AUTHENTICODE_FIXTURE=$binary" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Run Authenticode tamper regression on controlled unsigned PE fixture
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SKY_AUTHENTICODE_FIXTURE) -or
              -not (Test-Path -LiteralPath $env:SKY_AUTHENTICODE_FIXTURE -PathType Leaf)) {
            throw "Controlled unsigned Authenticode fixture is unavailable"
          }
          pwsh scripts/test_v4_authenticode_integrity.ps1 -Source $env:SKY_AUTHENTICODE_FIXTURE
          if ($LASTEXITCODE -ne 0) { throw "Authenticode tamper regression failed with exit code $LASTEXITCODE" }

      - name: Clean up controlled Authenticode PE fixture
        if: always()
        shell: pwsh
        run: |
          $fixture = ([string]$env:SKY_AUTHENTICODE_FIXTURE).Trim()
          $runnerTemp = [IO.Path]::GetFullPath(([string]$env:RUNNER_TEMP).Trim()).TrimEnd('\', '/')
          if (-not [string]::IsNullOrWhiteSpace($fixture)) {
            $resolved = [IO.Path]::GetFullPath($fixture)
            $prefix = $runnerTemp + [IO.Path]::DirectorySeparatorChar
            if (-not $resolved.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) -or
                [IO.Path]::GetFileName($resolved) -cne 'sky-v4-authenticode-unsigned-fixture.exe') {
              throw "Refusing to remove an Authenticode fixture outside RUNNER_TEMP: $resolved"
            }
            $fixtureRoot = Split-Path -Parent $resolved
            if (Test-Path -LiteralPath $fixtureRoot) {
              Remove-Item -LiteralPath $fixtureRoot -Recurse -Force
            }
          }

      - name: Clean up Authenticode test certificate
        if: always()
        shell: pwsh
        run: pwsh scripts/cleanup_v4_test_signing.ps1

      - name: Run V4 production signing contract test
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_v4_production_signing_contract.ps1
          if ($LASTEXITCODE -ne 0) { throw "V4 production signing contract test failed with exit code $LASTEXITCODE" }

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_RELEASE_CONTRACT:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`release-contract\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  supply_chain:
    name: Supply-chain and advisory security
    needs: changes
    if: needs.changes.outputs.supply_chain_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_SUPPLY_CHAIN=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore pinned cargo-audit tool
        id: cargo-audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-rust-1.98

      - name: Restore pinned cargo-vet tool
        id: cargo-vet-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: RustSec dependency audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          tool_root="$RUNNER_TEMP/cargo-audit"
          if [[ ! -x "$tool_root/bin/cargo-audit" ]]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$tool_root"
          fi
          export PATH="$tool_root/bin:$PATH"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          version="$("$tool_root/bin/cargo-audit" --version)"
          [[ "$version" == "cargo-audit $CARGO_AUDIT_VERSION" ]]
          cargo audit --file rust/Cargo.lock

      - name: Save pinned cargo-audit tool
        if: github.event_name != 'pull_request' && steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-rust-1.98

      - name: JavaScript dependency advisory scan
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: |-
            --lockfile=./desktop/bun.lock

      - name: Cargo-vet dependency policy
        env:
          CARGO_VET_VERSION: 0.10.2
        run: |
          tool_root="$RUNNER_TEMP/cargo-vet"
          if [[ ! -x "$tool_root/bin/cargo-vet" ]]; then
            cargo install cargo-vet --version "$CARGO_VET_VERSION" --locked --root "$tool_root"
          fi
          export PATH="$tool_root/bin:$PATH"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          version="$("$tool_root/bin/cargo-vet" --version)"
          [[ "$version" == "cargo-vet $CARGO_VET_VERSION" ]]
          cargo vet --manifest-path rust/Cargo.toml --locked

      - name: Save pinned cargo-vet tool
        if: github.event_name != 'pull_request' && steps.cargo-vet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_SUPPLY_CHAIN:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`supply_chain\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.rust_required == 'true' || needs.changes.outputs.desktop_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_VALIDATE=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain
        if: needs.changes.outputs.rust_required == 'true' || needs.changes.outputs.desktop_required == 'true'
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify pinned stable toolchain
        if: needs.changes.outputs.rust_required == 'true' || needs.changes.outputs.desktop_required == 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 from rust/rust-toolchain.toml, got: $version"
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Repository verification — Rust
        if: needs.changes.outputs.rust_required == 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check rust

      - name: Fail fast on Rust validation dependencies
        if: needs.changes.outputs.rust_required == 'true'
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,sccache

      - name: Fail fast on native desktop validation dependencies
        if: needs.changes.outputs.desktop_required == 'true'
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,sccache

      - name: Repository verification — native desktop
        if: needs.changes.outputs.desktop_required == 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check desktop-native

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job validate -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  desktop_web:
    name: Desktop web and browser validation
    needs: changes
    if: needs.changes.outputs.desktop_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_DESKTOP_WEB=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun for desktop web validation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install pinned desktop web dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Repository verification — desktop web
        working-directory: desktop
        run: bun run check

      - name: Verify local Playwright CLI
        if: needs.changes.outputs.desktop_e2e_required == 'true'
        working-directory: desktop
        run: |
          expected=$(node -p "require('./package.json').devDependencies.playwright")
          actual=$(bun node_modules/playwright/cli.js --version | sed -E 's/^Version[[:space:]]+//')
          test "$actual" = "$expected" || { echo "Playwright CLI mismatch: package.json=$expected local=$actual"; exit 1; }

      - name: Install Chromium through pinned local Playwright CLI
        if: needs.changes.outputs.desktop_e2e_required == 'true'
        working-directory: desktop
        run: bun node_modules/playwright/cli.js install chromium

      - name: Run desktop browser E2E
        if: needs.changes.outputs.desktop_e2e_required == 'true'
        working-directory: desktop
        run: bun run test:e2e

      - name: Run production-bundle browser smoke
        if: needs.changes.outputs.desktop_e2e_required == 'true'
        working-directory: desktop
        run: bun run test:e2e:bundle

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_DESKTOP_WEB:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - $(date -d "$start_time" +%s) ))
            {
              echo "## CI job timing"
              echo "- Job: \`desktop-web\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  candidate:
    name: Build current Tauri candidate
    needs: changes
    if: needs.changes.outputs.package_required == 'true' || needs.changes.outputs.updater_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1
      SKY_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_CANDIDATE=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain for current candidate
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify current-candidate compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for current candidate, got: $version"
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Bun for current candidate
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Fail fast on current-candidate dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx,sccache

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build pinned desktop frontend once
        working-directory: desktop
        run: bun run build

      - name: Build exactly one current Tauri candidate
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "sky-auto-player-current-candidate.key"
          $publicKeyPath = Join-Path $env:RUNNER_TEMP "sky-auto-player-current-candidate.pub"
          $configPath = Join-Path $env:RUNNER_TEMP "sky-auto-player-current-candidate-updater.json"
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "rust/target/dist/bundle/nsis"
          if (Test-Path -LiteralPath $bundleDir) {
            Remove-Item -LiteralPath $bundleDir -Recurse -Force
          }
          try {
            Push-Location desktop
            try {
              bun run tauri signer generate --ci --password "" --force -w $keyPath
              if ($LASTEXITCODE -ne 0) { throw "Tauri updater signer generation failed with exit code $LASTEXITCODE" }
              Copy-Item -LiteralPath "$keyPath.pub" -Destination $publicKeyPath -Force
              $privateKey = (Get-Content -LiteralPath $keyPath -Raw).Trim()
              $testPublicKey = (Get-Content -LiteralPath $publicKeyPath -Raw).Trim()
              [ordered]@{
                plugins = [ordered]@{
                  updater = [ordered]@{
                    pubkey = $testPublicKey
                    endpoints = @("https://example.invalid/sky-auto-player/{{target}}/{{arch}}/{{current_version}}")
                  }
                }
              } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $configPath -Encoding utf8
              $env:TAURI_SIGNING_PRIVATE_KEY = $privateKey
              $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
              $env:SKY_AUTHENTICODE_MODE = "unsigned-zero-budget"
              bun run tauri build --ci --config $configPath -- --profile dist
              if ($LASTEXITCODE -ne 0) { throw "Current Tauri candidate build failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            Remove-Item -LiteralPath $keyPath, "$keyPath.pub", $configPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:SKY_AUTHENTICODE_MODE -ErrorAction SilentlyContinue
          }
          "SKY_CANDIDATE_BUNDLE=$bundleDir" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_PUBLIC_KEY=$publicKeyPath" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Create exact current-candidate contract
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP "sky-auto-player-current-candidate"
          pwsh scripts/ci_validate_candidate.ps1 `
            -Mode Create `
            -BundleDir $env:SKY_CANDIDATE_BUNDLE `
            -PublicKeyPath $env:SKY_CANDIDATE_PUBLIC_KEY `
            -OutputRoot $candidateRoot `
            -SourceSha $env:SKY_CI_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Current-candidate contract creation failed with exit code $LASTEXITCODE" }
          $files = @(Get-ChildItem -LiteralPath $candidateRoot -File)
          if ($files.Count -ne 4 -or $files.Name -contains "sky-auto-player-current-candidate.key") {
            throw "Current-candidate artifact contains an unexpected file set"
          }
          "SKY_CANDIDATE_ROOT=$candidateRoot" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Upload exact current-candidate contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sky-auto-player-current-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sky-auto-player-current-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job candidate -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  updater_e2e:
    name: Updater fixture qualification
    needs: [changes, static, candidate, updater_bridge]
    if: needs.changes.outputs.updater_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_UPDATER_E2E=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download current candidate from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sky-auto-player-current-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sky-auto-player-current-candidate

      - name: Download updater bridge from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sky-auto-player-updater-bridge-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sky-auto-player-updater-bridge

      - name: Validate and bind exact current candidate
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP "sky-auto-player-current-candidate"
          pwsh scripts/ci_validate_candidate.ps1 `
            -Mode Validate `
            -CandidateRoot $candidateRoot `
            -SourceSha "${{ github.event.pull_request.head.sha || github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded current-candidate contract validation failed with exit code $LASTEXITCODE" }
          $metadata = Get-Content -LiteralPath (Join-Path $candidateRoot "candidate.json") -Raw | ConvertFrom-Json
          "SKY_CANDIDATE_INSTALLER=$(Join-Path $candidateRoot $metadata.installer)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_SIGNATURE=$(Join-Path $candidateRoot $metadata.updater_signature)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_PUBLIC_KEY=$(Join-Path $candidateRoot $metadata.updater_public_key)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_VERSION=$($metadata.version)" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Validate and bind exact updater bridge
        run: |
          $bridgeRoot = Join-Path $env:RUNNER_TEMP "sky-auto-player-updater-bridge"
          $metadata = Get-Content -LiteralPath (Join-Path $bridgeRoot "bridge.json") -Raw | ConvertFrom-Json
          pwsh scripts/ci_validate_bridge.ps1 `
            -Mode Validate `
            -BridgeRoot $bridgeRoot `
            -SourceSha "${{ github.event.pull_request.head.sha || github.sha }}" `
            -Version $metadata.version `
            -SentinelId $metadata.sentinel_id `
            -SentinelContentSha256 $metadata.sentinel_content_sha256
          if ($LASTEXITCODE -ne 0) { throw "Downloaded updater-bridge contract validation failed with exit code $LASTEXITCODE" }
          $installer = Join-Path $bridgeRoot $metadata.installer
          "SKY_BRIDGE_ROOT=$bridgeRoot" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_INSTALLER=$installer" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_SOURCE_SHA=$($metadata.source_sha)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_VERSION=$($metadata.version)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_SENTINEL_ID=$($metadata.sentinel_id)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_SENTINEL_SHA256=$($metadata.sentinel_content_sha256)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_BRIDGE_INSTALLER_SHA256=$($metadata.installer_sha256)" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Rust — install pinned stable toolchain for updater fixture
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc

      - name: Rust — verify updater-fixture compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for updater fixture, got: $version"
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Bun for updater fixture frontend
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Fail fast on updater fixture dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx,sccache,signtool.exe

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Prepare bounded ephemeral Authenticode test certificate
        timeout-minutes: 2
        run: pwsh scripts/setup_v4_test_signing.ps1 -EnvFile $env:GITHUB_ENV -TimeoutSeconds 30

      - name: Install provided bridge and qualify packaged Tauri updater rotation
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $fixtureTarget = Join-Path $env:RUNNER_TEMP "sky-auto-player-v4-updater-fixture-target"
          New-Item -ItemType Directory -Path $fixtureTarget -Force | Out-Null
          # Provided-bridge mode installs the exact producer bytes and performs
          # zero bridge or candidate tauri build in this consumer.
          pwsh scripts/ci_tauri_update_e2e.ps1 `
            -FixtureTargetDir $fixtureTarget `
            -CandidateInstallerPath $env:SKY_CANDIDATE_INSTALLER `
            -CandidateSignaturePath $env:SKY_CANDIDATE_SIGNATURE `
            -CandidateVersion $env:SKY_CANDIDATE_VERSION `
            -CandidatePublicKeyPath $env:SKY_CANDIDATE_PUBLIC_KEY `
            -BridgeRootPath $env:SKY_BRIDGE_ROOT `
            -BridgeInstallerPath $env:SKY_BRIDGE_INSTALLER `
            -BridgeSourceSha $env:SKY_BRIDGE_SOURCE_SHA `
            -BridgeVersion $env:SKY_BRIDGE_VERSION `
            -BridgeSentinelId $env:SKY_BRIDGE_SENTINEL_ID `
            -BridgeSentinelSha256 $env:SKY_BRIDGE_SENTINEL_SHA256

      - name: Clean up ephemeral Authenticode test certificate
        if: always()
        run: pwsh scripts/cleanup_v4_test_signing.ps1

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job updater-e2e -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  packaged:
    name: Packaged v4 Tauri NSIS qualification
    needs: [changes, static, candidate]
    if: needs.changes.outputs.package_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_PACKAGED=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download current candidate from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sky-auto-player-current-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/sky-auto-player-current-candidate

      - name: Validate exact current candidate contract
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP "sky-auto-player-current-candidate"
          pwsh scripts/ci_validate_candidate.ps1 `
            -Mode Validate `
            -CandidateRoot $candidateRoot `
            -SourceSha "${{ github.event.pull_request.head.sha || github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded current-candidate contract validation failed with exit code $LASTEXITCODE" }
          $metadata = Get-Content -LiteralPath (Join-Path $candidateRoot "candidate.json") -Raw | ConvertFrom-Json
          $installer = Join-Path $candidateRoot $metadata.installer
          $signature = Join-Path $candidateRoot $metadata.updater_signature
          "SKY_CANDIDATE_ROOT=$candidateRoot" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_INSTALLER=$installer" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_SIGNATURE=$signature" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_PUBLIC_KEY=$(Join-Path $candidateRoot $metadata.updater_public_key)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_VERSION=$($metadata.version)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_INSTALLER_SHA256=$($metadata.installer_sha256)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          "SKY_CANDIDATE_SIGNATURE_SHA256=$($metadata.updater_signature_sha256)" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Rust — install pinned stable toolchain for packaged build
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify packaged-build compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for packaged build, got: $version"
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          cache-on-failure: true
          # Pull-request package jobs restore the shared cache but do not spend
          # the required-job critical path writing a duplicate package cache.
          # Main/manual runs remain the cache population path.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Fail fast on package qualification dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,sccache

      - name: Stage and re-hash exact current candidate after Rust cache restore
        run: |
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "rust/target/dist/bundle/nsis"
          if (Test-Path -LiteralPath $bundleDir) {
            Remove-Item -LiteralPath $bundleDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          $metadata = Get-Content -LiteralPath (Join-Path $env:SKY_CANDIDATE_ROOT "candidate.json") -Raw | ConvertFrom-Json
          $stagedInstaller = Join-Path $bundleDir $metadata.installer
          $stagedSignature = Join-Path $bundleDir $metadata.updater_signature
          Copy-Item -LiteralPath $env:SKY_CANDIDATE_INSTALLER -Destination $stagedInstaller -Force
          Copy-Item -LiteralPath $env:SKY_CANDIDATE_SIGNATURE -Destination $stagedSignature -Force
          $installerSha = (Get-FileHash -LiteralPath $stagedInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          $signatureSha = (Get-FileHash -LiteralPath $stagedSignature -Algorithm SHA256).Hash.ToLowerInvariant()
          $publicKeySha = (Get-FileHash -LiteralPath $env:SKY_CANDIDATE_PUBLIC_KEY -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerSha -cne [string]$metadata.installer_sha256) { throw "Staged installer hash changed: expected=$($metadata.installer_sha256) observed=$installerSha" }
          if ($signatureSha -cne [string]$metadata.updater_signature_sha256) { throw "Staged updater signature hash changed: expected=$($metadata.updater_signature_sha256) observed=$signatureSha" }
          if ($publicKeySha -cne [string]$metadata.updater_public_key_sha256) { throw "Downloaded updater public-key hash changed: expected=$($metadata.updater_public_key_sha256) observed=$publicKeySha" }
          if ($installerSha -cne $env:SKY_CANDIDATE_INSTALLER_SHA256 -or $signatureSha -cne $env:SKY_CANDIDATE_SIGNATURE_SHA256) {
            throw "Staged candidate hashes do not match the validated candidate contract"
          }
          "SKY_TAURI_BUNDLE=$bundleDir" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Verify Tauri Authenticode signature
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $installers = @(Get-ChildItem -LiteralPath $env:SKY_TAURI_BUNDLE -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Tauri NSIS installer before Authenticode verification; found $($installers.Count)"
          }
          $installer = $installers[0].FullName
          pwsh scripts/verify_v4_authenticode.ps1 `
            -Mode unsigned-zero-budget `
            -Artifact $installer `
            -Evidence rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed with exit code $LASTEXITCODE" }

      - name: Generate Tauri SPDX SBOM
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo xtask sbom generate `
            --artifact-dir $env:SKY_TAURI_BUNDLE `
            --output rust/target/dist/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed with exit code $LASTEXITCODE" }

      - name: Verify Tauri SPDX SBOM
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo xtask sbom verify `
            --artifact-dir $env:SKY_TAURI_BUNDLE `
            --sbom rust/target/dist/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM verification failed with exit code $LASTEXITCODE" }

      - name: Verify exact Tauri NSIS bundle
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo xtask verify-tauri-bundle `
            --bundle-dir $env:SKY_TAURI_BUNDLE `
            --summary rust/target/dist/TAURI_ARTIFACT_SUMMARY.json `
            --authenticode-evidence rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json `
            --sbom rust/target/dist/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri bundle verification failed with exit code $LASTEXITCODE" }

      - name: Report exact Tauri NSIS artifact identity
        run: |
          $summary = Get-Content rust/target/dist/TAURI_ARTIFACT_SUMMARY.json -Raw | ConvertFrom-Json
          @"
          ## Tauri NSIS artifact
          - identifier: ``$($summary.identifier)``
          - version: ``$($summary.version)``
          - installer: ``$($summary.installer)`` ($($summary.installer_size) bytes)
          - updater signature: ``$($summary.updater_signature)`` ($($summary.signature_size) bytes)
          - target: ``$($summary.target)``
          - install mode: ``$($summary.install_mode)``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Qualify current-user install, launch, and uninstall
        run: |
          $summary = Get-Content rust/target/dist/TAURI_ARTIFACT_SUMMARY.json -Raw | ConvertFrom-Json
          $installer = Join-Path $env:SKY_TAURI_BUNDLE $summary.installer
          $installRoot = Join-Path $env:RUNNER_TEMP ("sky-auto-player-v4-smoke-" + [guid]::NewGuid().ToString("N"))
          $appPath = Join-Path $installRoot "sky_desktop_shell.exe"
          $uninstaller = Join-Path $installRoot "uninstall.exe"
          $appProcess = $null
          $installerRun = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($installerRun.ExitCode -ne 0) { throw "Tauri NSIS installer exited with $($installerRun.ExitCode)" }
          try {
            if (-not (Test-Path -LiteralPath $appPath)) { throw "Installed Tauri executable is missing: $appPath" }
            if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Tauri uninstaller is missing: $uninstaller" }
            cargo xtask builtin-catalog verify-installed --root (Join-Path $installRoot "builtin-songs")
            if ($LASTEXITCODE -ne 0) { throw "Installed built-in catalog verification failed with exit code $LASTEXITCODE" }
            $installedPe = @(Get-ChildItem -LiteralPath $installRoot -File -Recurse |
              Where-Object { $_.Extension.ToLowerInvariant() -in @('.exe', '.dll') -and $_.Name -ne 'uninstall.exe' })
            if ($installedPe.Count -eq 0) { throw "Installed Tauri tree contains no project PE files" }
            pwsh scripts/verify_v4_authenticode.ps1 `
              -Mode unsigned-zero-budget `
              -Artifact $installedPe.FullName `
              -Evidence rust/target/dist/INSTALLED_AUTHENTICODE_EVIDENCE.json
            if ($LASTEXITCODE -ne 0) { throw "Installed Authenticode verification failed with exit code $LASTEXITCODE" }
            $freshAppData = Join-Path $env:RUNNER_TEMP ("sky-auto-player-v4-fresh-appdata-" + [guid]::NewGuid().ToString("N"))
            $env:SKY_APP_DATA_ROOT = $freshAppData
            $env:SKY_BUILTIN_CATALOG_FRESH_SELFTEST = "1"
            try {
              $catalogSelftest = Start-Process -FilePath $appPath -ArgumentList @("--selftest-desktop-shell") -WindowStyle Hidden -Wait -PassThru
              if ($catalogSelftest.ExitCode -ne 0) { throw "Packaged built-in catalog self-test exited with $($catalogSelftest.ExitCode)" }
              $userSongs = @(Get-ChildItem -LiteralPath (Join-Path $freshAppData "songs") -File -Recurse -ErrorAction SilentlyContinue)
              if ($userSongs.Count -ne 0) { throw "Built-in catalog self-test populated the user songs directory" }
              "Packaged built-in catalog fresh-install self-test: PASS (user songs remain empty; user composition exercised)" | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
            } finally {
              Remove-Item Env:SKY_APP_DATA_ROOT -ErrorAction SilentlyContinue
              Remove-Item Env:SKY_BUILTIN_CATALOG_FRESH_SELFTEST -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $freshAppData) { Remove-Item -LiteralPath $freshAppData -Recurse -Force -ErrorAction SilentlyContinue }
            }
            $appProcess = Start-Process -FilePath $appPath -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 5
            if ($appProcess.HasExited) { throw "Packaged Tauri application exited during launch smoke (exit $($appProcess.ExitCode))" }
            Stop-Process -Id $appProcess.Id -Force
            $appProcess = $null
            $uninstallerRun = Start-Process -FilePath $uninstaller -ArgumentList @("/S") -WindowStyle Hidden -Wait -PassThru
            if ($uninstallerRun.ExitCode -ne 0) { throw "Tauri uninstaller exited with $($uninstallerRun.ExitCode)" }
            "Tauri NSIS install/launch/uninstall: PASS (installer=$($installerRun.ExitCode), uninstaller=$($uninstallerRun.ExitCode))" | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          } finally {
            if ($null -ne $appProcess -and -not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          }

      - name: Emit exact Tauri qualification evidence
        run: |
          $summary = Get-Content rust/target/dist/TAURI_ARTIFACT_SUMMARY.json -Raw | ConvertFrom-Json
          foreach ($field in @("installer_sha256", "updater_signature_sha256", "installer", "updater_signature", "version")) {
            if ([string]::IsNullOrWhiteSpace([string]$summary.$field)) {
              throw "Tauri artifact summary is missing qualification field: $field"
            }
          }
          $evidence = [ordered]@{
            schema_version = 1
            evidence_type = "tauri-nsis-qualified-release"
            qualified = $true
            qualification = "install-launch-uninstall"
            source_sha = (Get-Content -LiteralPath (Join-Path $env:SKY_CANDIDATE_ROOT "candidate.json") -Raw | ConvertFrom-Json).source_sha
            candidate_contract = "candidate.json"
            product_name = $summary.product_name
            identifier = $summary.identifier
            version = $summary.version
            target = $summary.target
            install_mode = $summary.install_mode
            installer = $summary.installer
            updater_signature = $summary.updater_signature
            installer_size = $summary.installer_size
            signature_size = $summary.signature_size
            installer_sha256 = $summary.installer_sha256
            updater_signature_sha256 = $summary.updater_signature_sha256
            updater_public_key_sha256 = (Get-FileHash -LiteralPath $env:SKY_CANDIDATE_PUBLIC_KEY -Algorithm SHA256).Hash.ToLowerInvariant()
            authenticode_mode = "unsigned-zero-budget"
            authenticode_evidence = "TAURI_AUTHENTICODE_EVIDENCE.json"
            authenticode_evidence_sha256 = (Get-FileHash -LiteralPath rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json -Algorithm SHA256).Hash.ToLowerInvariant()
            sbom = "SBOM.spdx.json"
            sbom_sha256 = (Get-FileHash -LiteralPath rust/target/dist/SBOM.spdx.json -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath rust/target/dist/V4_QUALIFICATION_EVIDENCE.json -Encoding utf8

      - name: Upload exact Tauri NSIS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sky-auto-player-tauri-nsis-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            rust/target/dist/bundle/nsis
            rust/target/dist/TAURI_ARTIFACT_SUMMARY.json
            rust/target/dist/V4_QUALIFICATION_EVIDENCE.json
            rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json
            rust/target/dist/INSTALLED_AUTHENTICODE_EVIDENCE.json
            rust/target/dist/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job packaged -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  site:
    name: Website validation
    needs: changes
    if: needs.changes.outputs.site_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate site
        uses: ./.github/actions/site-validate

  status:
    name: Sky Auto Player — required CI gate
    if: always()
    needs: [changes, static, release_contract, supply_chain, validate, desktop_web, candidate, updater_bridge, updater_contract, updater_e2e, packaged, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_STATUS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust_required }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop_required }}
          DESKTOP_E2E_REQUIRED: ${{ needs.changes.outputs.desktop_e2e_required }}
          PACKAGE_REQUIRED: ${{ needs.changes.outputs.package_required }}
          UPDATER_REQUIRED: ${{ needs.changes.outputs.updater_required }}
          RELEASE_REQUIRED: ${{ needs.changes.outputs.release_required }}
          SUPPLY_CHAIN_REQUIRED: ${{ needs.changes.outputs.supply_chain_required }}
          SITE_REQUIRED: ${{ needs.changes.outputs.site_required }}
          STATIC_REQUIRED: ${{ needs.changes.outputs.static_required }}
          CANDIDATE_REQUIRED: ${{ needs.changes.outputs.package_required == 'true' || needs.changes.outputs.updater_required == 'true' }}
          UPDATER_BRIDGE_REQUIRED: ${{ needs.changes.outputs.updater_required }}
          UPDATER_CONTRACT_REQUIRED: ${{ needs.changes.outputs.updater_required }}
          DESKTOP_WEB_REQUIRED: ${{ needs.changes.outputs.desktop_required }}
          STATIC_RESULT: ${{ needs.static.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release_contract.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply_chain.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          UPDATER_BRIDGE_RESULT: ${{ needs.updater_bridge.result }}
          UPDATER_CONTRACT_RESULT: ${{ needs.updater_contract.result }}
          UPDATER_E2E_RESULT: ${{ needs.updater_e2e.result }}
          PACKAGED_RESULT: ${{ needs.packaged.result }}
          DESKTOP_WEB_RESULT: ${{ needs.desktop_web.result }}
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          if [[ "$STATIC_REQUIRED" == "true" ]]; then
            [[ "$STATIC_RESULT" == "success" ]]
          else
            [[ "$STATIC_RESULT" == "skipped" ]]
          fi
          if [[ "$RELEASE_REQUIRED" == "true" ]]; then
            [[ "$RELEASE_CONTRACT_RESULT" == "success" ]]
          else
            [[ "$RELEASE_CONTRACT_RESULT" == "skipped" ]]
          fi
          if [[ "$SUPPLY_CHAIN_REQUIRED" == "true" ]]; then
            [[ "$SUPPLY_CHAIN_RESULT" == "success" ]]
          else
            [[ "$SUPPLY_CHAIN_RESULT" == "skipped" ]]
          fi
          if [[ "$RUST_REQUIRED" == "true" || "$DESKTOP_REQUIRED" == "true" ]]; then [[ "$VALIDATE_RESULT" == "success" ]]; else [[ "$VALIDATE_RESULT" == "skipped" ]]; fi
          if [[ "$DESKTOP_WEB_REQUIRED" == "true" ]]; then [[ "$DESKTOP_WEB_RESULT" == "success" ]]; else [[ "$DESKTOP_WEB_RESULT" == "skipped" ]]; fi
          if [[ "$CANDIDATE_REQUIRED" == "true" ]]; then [[ "$CANDIDATE_RESULT" == "success" ]]; else [[ "$CANDIDATE_RESULT" == "skipped" ]]; fi
          if [[ "$UPDATER_BRIDGE_REQUIRED" == "true" ]]; then [[ "$UPDATER_BRIDGE_RESULT" == "success" ]]; else [[ "$UPDATER_BRIDGE_RESULT" == "skipped" ]]; fi
          if [[ "$UPDATER_CONTRACT_REQUIRED" == "true" ]]; then [[ "$UPDATER_CONTRACT_RESULT" == "success" ]]; else [[ "$UPDATER_CONTRACT_RESULT" == "skipped" ]]; fi
          if [[ "$UPDATER_REQUIRED" == "true" ]]; then [[ "$UPDATER_E2E_RESULT" == "success" ]]; else [[ "$UPDATER_E2E_RESULT" == "skipped" ]]; fi
          if [[ "$PACKAGE_REQUIRED" == "true" ]]; then
            [[ "$PACKAGED_RESULT" == "success" ]]
          else
            [[ "$PACKAGED_RESULT" == "skipped" ]]
          fi
          if [[ "$SITE_REQUIRED" == "true" ]]; then [[ "$SITE_RESULT" == "success" ]]; else [[ "$SITE_RESULT" == "skipped" ]]; fi
          echo "CI status is green."

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_STATUS:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`status\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
