name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Classify validation layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      static_required: ${{ steps.filter-pr.outputs.static_required || steps.filter-full.outputs.static_required }}
      code_required: ${{ steps.filter-pr.outputs.code_required || steps.filter-full.outputs.code_required }}
      package_required: ${{ steps.filter-pr.outputs.package_required || steps.filter-full.outputs.package_required }}
      browser_required: ${{ steps.filter-pr.outputs.browser_required || steps.filter-full.outputs.browser_required }}
      classification_reason: ${{ steps.filter-pr.outputs.classification_reason || steps.filter-full.outputs.classification_reason }}

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_CHANGES=$(date +%s)" >> "$GITHUB_ENV"

      - name: Emit full qualification matrix for main / manual dispatch
        if: github.event_name != 'pull_request'
        id: filter-full
        run: |
          {
            echo "static_required=true"
            echo "code_required=true"
            echo "package_required=true"
            echo "browser_required=true"
            echo "classification_reason=full validation requested"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Validation classification'
            echo '```text'
            echo 'static_required=true'
            echo 'code_required=true'
            echo 'package_required=true'
            echo 'browser_required=true'
            echo 'classification_reason=full validation requested'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch PR base commit
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Install pinned Rust toolchain for classifier
        if: github.event_name == 'pull_request'
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Verify classifier toolchain
        if: github.event_name == 'pull_request'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          set -euo pipefail
          rustc --version | grep -E '^rustc 1\.98\.0 '

      - name: Classify PR changed paths
        if: github.event_name == 'pull_request'
        id: filter-pr
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          set -euo pipefail
          classification="$(cargo run --manifest-path rust/Cargo.toml -p sky_ci_classifier --locked -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$classification"
          {
            echo '## Validation classification'
            echo '```text'
            printf '%s\n' "$classification"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_CHANGES:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`changes\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.static_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_STATIC=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch Wave-6 retirement baseline commit
        run: |
          set -euo pipefail
          baseline="$(jq -r '.baseline' docs/migration/wave6-tooling-retirement-ledger.json)"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid baseline SHA in wave6 ledger: $baseline" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$baseline"
          git cat-file -e "$baseline^{commit}"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore pinned cargo-audit tool
        id: cargo-audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-rust-1.98

      - name: Restore pinned cargo-vet tool
        id: cargo-vet-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: RustSec dependency audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          tool_root="$RUNNER_TEMP/cargo-audit"
          if [[ ! -x "$tool_root/bin/cargo-audit" ]]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$tool_root"
          fi
          export PATH="$tool_root/bin:$PATH"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          version="$("$tool_root/bin/cargo-audit" --version)"
          [[ "$version" == "cargo-audit $CARGO_AUDIT_VERSION" ]]
          cargo audit --file rust/Cargo.lock

      - name: Save pinned cargo-audit tool
        if: github.event_name != 'pull_request' && steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-rust-1.98

      - name: Cargo-vet dependency policy
        env:
          CARGO_VET_VERSION: 0.10.2
        run: |
          tool_root="$RUNNER_TEMP/cargo-vet"
          if [[ ! -x "$tool_root/bin/cargo-vet" ]]; then
            cargo install cargo-vet --version "$CARGO_VET_VERSION" --locked --root "$tool_root"
          fi
          export PATH="$tool_root/bin:$PATH"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          version="$("$tool_root/bin/cargo-vet" --version)"
          [[ "$version" == "cargo-vet $CARGO_VET_VERSION" ]]
          cargo vet --manifest-path rust/Cargo.toml --locked

      - name: Save pinned cargo-vet tool
        if: github.event_name != 'pull_request' && steps.cargo-vet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: Repository verification — static
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check static

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_STATIC:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`static\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.code_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_VALIDATE=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch Wave-6 retirement baseline commit for restricted validation
        if: needs.changes.outputs.package_required == 'true'
        run: |
          $ledger = Get-Content "docs/migration/wave6-tooling-retirement-ledger.json" -Raw | ConvertFrom-Json
          $baseline = $ledger.baseline
          if ($baseline -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid baseline SHA in wave6 ledger: $baseline"
          }
          git fetch --no-tags --depth=1 origin $baseline
          git cat-file -e "$baseline^{commit}"

      - name: Rust — install pinned stable toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify pinned stable toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 from rust/rust-toolchain.toml, got: $version"
          }

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Restore pinned cargo-vet tool
        id: cargo-vet-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: Install and verify pinned cargo-vet
        env:
          CARGO_VET_VERSION: 0.10.2
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "cargo-vet"
          $binary = Join-Path $toolRoot "bin\cargo-vet.exe"
          if (-not (Test-Path $binary)) {
            cargo install cargo-vet --version $env:CARGO_VET_VERSION --locked --root $toolRoot
          }
          $version = (& $binary --version).Trim()
          if ($version -ne "cargo-vet $env:CARGO_VET_VERSION") {
            throw "Expected cargo-vet $env:CARGO_VET_VERSION, got: $version"
          }
          (Split-Path -Parent $binary) | Add-Content $env:GITHUB_PATH -Encoding UTF8

      - name: Save pinned cargo-vet tool
        if: github.event_name != 'pull_request' && steps.cargo-vet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: Repository verification — Rust
        if: needs.changes.outputs.package_required != 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check rust

      - name: Set up Bun for desktop verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install Chromium for desktop browser smoke
        if: needs.changes.outputs.browser_required == 'true'
        working-directory: desktop
        run: bunx playwright install chromium

      - name: Construct Python-unavailable validation environment
        if: needs.changes.outputs.package_required == 'true'
        run: |
          $required = @("cargo", "cargo-vet", "rustc", "rustup", "git", "bun", "bunx", "link", "rc")
          $toolDirectories = foreach ($name in $required) {
            $command = Get-Command $name -ErrorAction SilentlyContinue
            if ($command) { Split-Path -Parent $command.Source }
          }
          $systemRoot = if ($env:SystemRoot) { $env:SystemRoot } else { "C:\Windows" }
          $restricted = @(
            $toolDirectories
            (Join-Path $systemRoot "System32")
            (Join-Path $systemRoot "System32\Wbem")
          ) | Where-Object { $_ } | Select-Object -Unique
          $env:PATH = $restricted -join ";"
          foreach ($name in @("python", "python3", "py", "uv")) {
            $found = where.exe $name 2>$null
            if ($LASTEXITCODE -eq 0 -and $found) { throw "$name remains discoverable in restricted PATH: $found" }
            Write-Host "${name}: not found"
          }
          $global:LASTEXITCODE = 0
          foreach ($name in @("PYTHONHOME", "PYTHONPATH", "PYTHONUTF8", "VIRTUAL_ENV", "UV_PYTHON", "UV_PROJECT_ENVIRONMENT", "UV_TOOL_DIR", "UV_TOOL_BIN_DIR")) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          "PATH=$env:PATH" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          foreach ($name in @("PYTHONHOME", "PYTHONPATH", "PYTHONUTF8", "VIRTUAL_ENV", "UV_PYTHON", "UV_PROJECT_ENVIRONMENT", "UV_TOOL_DIR", "UV_TOOL_BIN_DIR")) {
            "$name=" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          }

      - name: Restricted repository verification without Python
        if: needs.changes.outputs.package_required == 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo xtask check static
          if ($LASTEXITCODE -ne 0) { throw "cargo xtask check static failed with exit code $LASTEXITCODE" }
          cargo xtask check rust
          if ($LASTEXITCODE -ne 0) { throw "cargo xtask check rust failed with exit code $LASTEXITCODE" }
          if ("${{ needs.changes.outputs.browser_required }}" -eq "true") {
            cargo xtask check desktop
          } else {
            $env:SKY_DESKTOP_SKIP_BROWSER = "1"
            cargo xtask check desktop
          }
          if ($LASTEXITCODE -ne 0) { throw "cargo xtask check desktop failed with exit code $LASTEXITCODE" }

      - name: Repository verification — desktop
        if: needs.changes.outputs.package_required != 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          if ("${{ needs.changes.outputs.browser_required }}" -eq "true") {
            cargo xtask check desktop
          } else {
            $env:SKY_DESKTOP_SKIP_BROWSER = "1"
            cargo xtask check desktop
          }

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job validate -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  packaged:
    name: Packaged frozen unsigned app smoke
    needs: changes
    if: needs.changes.outputs.package_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_PACKAGED=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain for packaged build
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify packaged-build compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for packaged build, got: $version"
          }

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-on-failure: true
          # Pull-request package jobs restore the shared cache but do not spend
          # the required-job critical path writing a duplicate package cache.
          # Main/manual runs remain the cache population path.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Bun for production frontend build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Construct Python-unavailable canonical environment
        run: |
          $required = @("cargo", "rustc", "rustup", "git", "bun", "bunx", "link", "rc")
          $toolDirectories = foreach ($name in $required) {
            $command = Get-Command $name -ErrorAction SilentlyContinue
            if ($command) { Split-Path -Parent $command.Source }
          }
          $systemRoot = if ($env:SystemRoot) { $env:SystemRoot } else { "C:\Windows" }
          $restricted = @(
            $toolDirectories
            (Join-Path $systemRoot "System32")
            (Join-Path $systemRoot "System32\Wbem")
          ) | Where-Object { $_ } | Select-Object -Unique
          $env:PATH = $restricted -join ";"
          foreach ($name in @("python", "python3", "py", "uv")) {
            $found = where.exe $name 2>$null
            if ($LASTEXITCODE -eq 0 -and $found) { throw "$name remains discoverable in restricted PATH: $found" }
            Write-Host "${name}: not found"
          }
          $global:LASTEXITCODE = 0
          foreach ($name in @("PYTHONHOME", "PYTHONPATH", "PYTHONUTF8", "VIRTUAL_ENV", "UV_PYTHON", "UV_PROJECT_ENVIRONMENT", "UV_TOOL_DIR", "UV_TOOL_BIN_DIR")) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          "PATH=$env:PATH" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          foreach ($name in @("PYTHONHOME", "PYTHONPATH", "PYTHONUTF8", "VIRTUAL_ENV", "UV_PYTHON", "UV_PROJECT_ENVIRONMENT", "UV_TOOL_DIR", "UV_TOOL_BIN_DIR")) {
            "$name=" | Add-Content $env:GITHUB_ENV -Encoding UTF8
          }

      - name: Build and qualify exact portable artifact
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Sky Auto Player portable"
          cargo xtask dist --profile dist --output $output
          "SKY_PORTABLE_OUTPUT=$output" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Verify packaged release tree
        run: |
          $version = (cargo xtask version check | Select-String '^version=').ToString().Substring(8)
          cargo xtask verify-dist --release-dir (Join-Path $env:SKY_PORTABLE_OUTPUT "Sky-Auto-Player-v$version")

      - name: Report exact portable artifact identity
        shell: pwsh
        run: |
          $summary = Get-Content (Join-Path $env:SKY_PORTABLE_OUTPUT "PORTABLE_ARTIFACT_SUMMARY.json") -Raw | ConvertFrom-Json
          @"
          ## Exact portable artifact
          - repo head: ``$($summary.repo_head)``
          - ZIP: ``$($summary.artifact_name)`` ($($summary.artifact_size) bytes)
          - ZIP SHA-256: ``$($summary.artifact_sha256)``
          - MANIFEST SHA-256: ``$($summary.manifest_sha256)``
          - portable files: $($summary.portable_file_count)
          - managed entries: $($summary.managed_entry_count)
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Get-Content (Join-Path $env:SKY_PORTABLE_OUTPUT "PROVENANCE.json")

      - name: Upload exact portable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sky-auto-player-portable-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/Sky Auto Player portable
          if-no-files-found: error
          retention-days: 14

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job packaged -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  status:
    name: Sky Auto Player — required CI gate
    if: always()
    needs: [changes, static, validate, packaged]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_STATUS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_REQUIRED: ${{ needs.changes.outputs.static_required }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code_required }}
          PACKAGE_REQUIRED: ${{ needs.changes.outputs.package_required }}
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGED_RESULT: ${{ needs.packaged.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          if [[ "$STATIC_REQUIRED" == "true" ]]; then [[ "$STATIC_RESULT" == "success" ]]; else [[ "$STATIC_RESULT" == "skipped" ]]; fi
          if [[ "$CODE_REQUIRED" == "true" ]]; then [[ "$VALIDATE_RESULT" == "success" ]]; else [[ "$VALIDATE_RESULT" == "skipped" ]]; fi
          if [[ "$PACKAGE_REQUIRED" == "true" ]]; then [[ "$PACKAGED_RESULT" == "success" ]]; else [[ "$PACKAGED_RESULT" == "skipped" ]]; fi
          echo "CI status is green."

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_STATUS:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`status\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
