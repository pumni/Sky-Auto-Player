name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Classify validation layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      code_required: ${{ steps.filter-pr.outputs.code_required || steps.filter-full.outputs.code_required }}
      package_required: ${{ steps.filter-pr.outputs.package_required || steps.filter-full.outputs.package_required }}
      updater_required: ${{ steps.filter-pr.outputs.updater_required || steps.filter-full.outputs.updater_required }}
      release_required: ${{ steps.filter-pr.outputs.release_required || steps.filter-full.outputs.release_required }}
      supply_chain_required: ${{ steps.filter-pr.outputs.supply_chain_required || steps.filter-full.outputs.supply_chain_required }}
      classification_reason: ${{ steps.filter-pr.outputs.classification_reason || steps.filter-full.outputs.classification_reason }}

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_CHANGES=$(date +%s)" >> "$GITHUB_ENV"

      - name: Emit full qualification matrix for main / manual dispatch
        if: github.event_name != 'pull_request'
        id: filter-full
        run: |
          {
            echo "code_required=true"
            echo "package_required=true"
            echo "updater_required=true"
            echo "release_required=true"
            echo "supply_chain_required=true"
            echo "classification_reason=full validation requested"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Validation classification'
            echo '```text'
            echo 'code_required=true'
            echo 'package_required=true'
            echo 'updater_required=true'
            echo 'release_required=true'
            echo 'supply_chain_required=true'
            echo 'classification_reason=full validation requested'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch PR base commit
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Install pinned Rust toolchain for classifier
        if: github.event_name == 'pull_request'
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Verify classifier toolchain
        if: github.event_name == 'pull_request'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          set -euo pipefail
          rustc --version | grep -E '^rustc 1\.98\.0 '

      - name: Classify PR changed paths
        if: github.event_name == 'pull_request'
        id: filter-pr
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          set -euo pipefail
          classification="$(cargo run --manifest-path rust/Cargo.toml -p sky_ci_classifier --locked -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$classification"
          {
            echo '## Validation classification'
            echo '```text'
            printf '%s\n' "$classification"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_CHANGES:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`changes\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.code_required == 'true' || needs.changes.outputs.package_required == 'true' || needs.changes.outputs.updater_required == 'true' || needs.changes.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_STATIC=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Repository verification — static
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check static --skip-supply-chain

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_STATIC:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`static\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release_contract:
    name: V4 release contract acceptance
    needs: changes
    if: needs.changes.outputs.release_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_RELEASE_CONTRACT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned toolchain for release contract tests
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Set up Bun for release contract tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Verify release contract test tools
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx

      - name: Install pinned desktop dependencies for release contract tests
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Read-only legacy GitHub Latest guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh scripts/ci_v4_release_latest_guard.ps1

      - name: Promotion digest regression self-test
        run: pwsh scripts/promote_v4_metadata.ps1 -SelfTest

      - name: V4 release pipeline mock state-machine self-test
        run: pwsh scripts/test_v4_release_pipeline.ps1

      - name: Run V4 production release orchestrator contract test
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_v4_production_orchestrator.ps1

      - name: Run V4 updater private-key verifier secret-output regression
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_v4_updater_private_key.ps1

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_RELEASE_CONTRACT:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`release-contract\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  supply_chain:
    name: Supply-chain and advisory security
    needs: changes
    if: needs.changes.outputs.supply_chain_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_SUPPLY_CHAIN=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Restore pinned cargo-audit tool
        id: cargo-audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-rust-1.98

      - name: Restore pinned cargo-vet tool
        id: cargo-vet-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: RustSec dependency audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          tool_root="$RUNNER_TEMP/cargo-audit"
          if [[ ! -x "$tool_root/bin/cargo-audit" ]]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$tool_root"
          fi
          export PATH="$tool_root/bin:$PATH"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          version="$("$tool_root/bin/cargo-audit" --version)"
          [[ "$version" == "cargo-audit $CARGO_AUDIT_VERSION" ]]
          cargo audit --file rust/Cargo.lock

      - name: Save pinned cargo-audit tool
        if: github.event_name != 'pull_request' && steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2-rust-1.98

      - name: Cargo-vet dependency policy
        env:
          CARGO_VET_VERSION: 0.10.2
        run: |
          tool_root="$RUNNER_TEMP/cargo-vet"
          if [[ ! -x "$tool_root/bin/cargo-vet" ]]; then
            cargo install cargo-vet --version "$CARGO_VET_VERSION" --locked --root "$tool_root"
          fi
          export PATH="$tool_root/bin:$PATH"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          version="$("$tool_root/bin/cargo-vet" --version)"
          [[ "$version" == "cargo-vet $CARGO_VET_VERSION" ]]
          cargo vet --manifest-path rust/Cargo.toml --locked

      - name: Save pinned cargo-vet tool
        if: github.event_name != 'pull_request' && steps.cargo-vet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-vet
          key: cargo-vet-${{ runner.os }}-${{ runner.arch }}-0.10.2-rust-1.98

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_SUPPLY_CHAIN:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`supply_chain\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.code_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_VALIDATE=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify pinned stable toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 from rust/rust-toolchain.toml, got: $version"
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Repository verification — Rust
        if: needs.changes.outputs.code_required == 'true'
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check rust

      - name: Set up Bun for desktop verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Fail fast on Windows validation dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx,sccache

      - name: Install Chromium for desktop browser smoke
        if: needs.changes.outputs.package_required == 'true'
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).devDependencies.playwright
          $actual = (& bun node_modules/playwright/cli.js --version).Trim() -replace '^Version\s+', ''
          if ($actual -ne $expected) {
            throw "Playwright CLI mismatch: package.json=$expected, local CLI=$actual"
          }
          bun node_modules/playwright/cli.js install chromium

      - name: Repository verification — desktop
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          if ("${{ needs.changes.outputs.package_required }}" -eq "true") {
            cargo xtask check desktop
          } else {
            $env:SKY_DESKTOP_SKIP_BROWSER = "1"
            cargo xtask check desktop
          }

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job validate -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  updater_e2e:
    name: Updater fixture qualification
    needs: [changes, static]
    if: needs.changes.outputs.updater_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_UPDATER_E2E=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain for updater fixture
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc

      - name: Rust — verify updater-fixture compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for updater fixture, got: $version"
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Bun for updater fixture frontend
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Fail fast on updater fixture dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx,sccache,signtool.exe

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build pinned desktop frontend
        working-directory: desktop
        run: bun run build

      - name: Prepare bounded ephemeral Authenticode test certificate
        timeout-minutes: 2
        run: pwsh scripts/setup_v4_test_signing.ps1 -EnvFile $env:GITHUB_ENV -TimeoutSeconds 30

      - name: Exercise non-production updater key rotation fixture
        run: pwsh scripts/test_v4_updater_key_rotation.ps1

      - name: Build throwaway signed fixture and qualify packaged Tauri updater rotation
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $fixtureTarget = Join-Path $env:RUNNER_TEMP "sky-auto-player-v4-updater-fixture-target"
          New-Item -ItemType Directory -Path $fixtureTarget -Force | Out-Null
          # Packaged Tauri updater rotation: ci_tauri_update_e2e.ps1 sets SKY_TAURI_UPDATE_FIXTURE_PUBLIC_KEYS
          # separately for the bridge [old,new] and cutover [new] tauri-update-fixture builds.
          # Its generated configs alone enable dangerousInsecureTransportProtocol on loopback.
          pwsh scripts/ci_tauri_update_e2e.ps1 -FixtureTargetDir $fixtureTarget

      - name: Clean up ephemeral Authenticode test certificate
        if: always()
        run: pwsh scripts/cleanup_v4_test_signing.ps1

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job updater-e2e -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  packaged:
    name: Packaged v4 Tauri NSIS qualification
    needs: [changes, static]
    if: needs.changes.outputs.package_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: sky-ci-v1

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_PACKAGED=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Rust — install pinned stable toolchain for packaged build
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify packaged-build compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for packaged build, got: $version"
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-targets: false
          cache-on-failure: true
          # Pull-request package jobs restore the shared cache but do not spend
          # the required-job critical path writing a duplicate package cache.
          # Main/manual runs remain the cache population path.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Bun for production frontend build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Fail fast on packaged build dependencies
        run: pwsh scripts/ci_require_windows_tools.ps1 -Tool cargo,rustc,rustup,git,bun,bunx,sccache,signtool.exe

      - name: Resolve GitHub CLI for artifact attestation verification
        run: |
          $ghCommand = Get-Command gh.exe -CommandType Application -ErrorAction Stop
          $ghPath = [IO.Path]::GetFullPath($ghCommand.Source)
          if (-not (Test-Path -LiteralPath $ghPath -PathType Leaf)) {
            throw "GitHub CLI executable is not a regular file: $ghPath"
          }
          "SKY_GH_PATH=$ghPath" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build pinned desktop frontend
        working-directory: desktop
        run: bun run build

      - name: Build and sign canonical Tauri NSIS artifact
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "sky-auto-player-v4-test.key"
          $configPath = Join-Path $env:RUNNER_TEMP "sky-auto-player-v4-test-updater.json"
          $preBuildCargoHash = (Get-FileHash -LiteralPath "desktop/src-tauri/Cargo.toml" -Algorithm SHA256).Hash
          try {
            Push-Location desktop
            try {
              bun run tauri signer generate --ci --password "" --force -w $keyPath
              if ($LASTEXITCODE -ne 0) { throw "Tauri updater signer generation failed with exit code $LASTEXITCODE" }
              $privateKey = (Get-Content -LiteralPath $keyPath -Raw).Trim()
              $testPublicKey = (Get-Content -LiteralPath "$keyPath.pub" -Raw).Trim()
              [ordered]@{
                plugins = [ordered]@{
                  updater = [ordered]@{
                    pubkey = $testPublicKey
                    endpoints = @("https://example.invalid/sky-auto-player/{{target}}/{{arch}}/{{current_version}}")
                  }
                }
              } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $configPath -Encoding utf8
              $env:TAURI_SIGNING_PRIVATE_KEY = $privateKey
              $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
              $env:SKY_AUTHENTICODE_MODE = "unsigned-zero-budget"
              bun run tauri build --ci --config $configPath -- --profile dist
              if ($LASTEXITCODE -ne 0) { throw "Tauri build failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
            $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'rust/target/dist/bundle/nsis'
            "SKY_TAURI_BUNDLE=$bundleDir" | Add-Content $env:GITHUB_ENV -Encoding UTF8
            $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter '*-setup.exe' -File)
            if ($installers.Count -ne 1) {
              throw "Expected exactly one freshly built Tauri NSIS installer, found $($installers.Count)"
            }
          } finally {
            Remove-Item -LiteralPath $keyPath, "$keyPath.pub", $configPath -Force -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            $postPackagingDirty = @(& git status --porcelain | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($postPackagingDirty.Count -gt 0) {
              $postBuildCargoHash = (Get-FileHash -LiteralPath "desktop/src-tauri/Cargo.toml" -Algorithm SHA256).Hash
              Write-Host "Pre-build Cargo.toml SHA256:  $preBuildCargoHash"
              Write-Host "Post-build Cargo.toml SHA256: $postBuildCargoHash"
              Write-Host "=== git status --porcelain ==="
              & git status --porcelain
              Write-Host "=== git diff --no-ext-diff -- desktop/src-tauri/Cargo.toml ==="
              & git diff --no-ext-diff -- desktop/src-tauri/Cargo.toml
              Write-Host "=== git diff --check -- desktop/src-tauri/Cargo.toml ==="
              & git diff --check -- desktop/src-tauri/Cargo.toml
              throw "Packaged build left working tree dirty: $($postPackagingDirty -join ', ')"
            }
          }

      - name: Prepare bounded ephemeral Authenticode test certificate
        timeout-minutes: 2
        run: pwsh scripts/setup_v4_test_signing.ps1 -EnvFile $env:GITHUB_ENV -TimeoutSeconds 30

      - name: Run Authenticode tamper regression
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          # CI self-signed credentials remain test-only; canonical package evidence is unsigned.
          pwsh scripts/test_v4_authenticode_integrity.ps1 `
            -Source rust/target/dist/sky_desktop_shell.exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode tamper regression failed with exit code $LASTEXITCODE" }

      - name: Run V4 production signing contract test
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test_v4_production_signing_contract.ps1
          if ($LASTEXITCODE -ne 0) { throw "V4 production signing contract test failed with exit code $LASTEXITCODE" }

      - name: Verify Tauri Authenticode signature
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $installers = @(Get-ChildItem -LiteralPath $env:SKY_TAURI_BUNDLE -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Tauri NSIS installer before Authenticode verification; found $($installers.Count)"
          }
          $installer = $installers[0].FullName
          pwsh scripts/verify_v4_authenticode.ps1 `
            -Mode unsigned-zero-budget `
            -Artifact $installer `
            -Evidence rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json
          if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed with exit code $LASTEXITCODE" }

      - name: Generate Tauri SPDX SBOM
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo xtask sbom generate `
            --artifact-dir $env:SKY_TAURI_BUNDLE `
            --output rust/target/dist/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed with exit code $LASTEXITCODE" }

      - name: Verify Tauri SPDX SBOM
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo xtask sbom verify `
            --artifact-dir $env:SKY_TAURI_BUNDLE `
            --sbom rust/target/dist/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM verification failed with exit code $LASTEXITCODE" }

      - name: Verify exact Tauri NSIS bundle
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          cargo xtask verify-tauri-bundle `
            --bundle-dir $env:SKY_TAURI_BUNDLE `
            --summary rust/target/dist/TAURI_ARTIFACT_SUMMARY.json `
            --authenticode-evidence rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json `
            --sbom rust/target/dist/SBOM.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri bundle verification failed with exit code $LASTEXITCODE" }

      - name: Report exact Tauri NSIS artifact identity
        run: |
          $summary = Get-Content rust/target/dist/TAURI_ARTIFACT_SUMMARY.json -Raw | ConvertFrom-Json
          @"
          ## Tauri NSIS artifact
          - identifier: ``$($summary.identifier)``
          - version: ``$($summary.version)``
          - installer: ``$($summary.installer)`` ($($summary.installer_size) bytes)
          - updater signature: ``$($summary.updater_signature)`` ($($summary.signature_size) bytes)
          - target: ``$($summary.target)``
          - install mode: ``$($summary.install_mode)``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Qualify current-user install, launch, and uninstall
        run: |
          $summary = Get-Content rust/target/dist/TAURI_ARTIFACT_SUMMARY.json -Raw | ConvertFrom-Json
          $installer = Join-Path $env:SKY_TAURI_BUNDLE $summary.installer
          $installRoot = Join-Path $env:RUNNER_TEMP ("sky-auto-player-v4-smoke-" + [guid]::NewGuid().ToString("N"))
          $appPath = Join-Path $installRoot "sky_desktop_shell.exe"
          $uninstaller = Join-Path $installRoot "uninstall.exe"
          $appProcess = $null
          $installerRun = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($installerRun.ExitCode -ne 0) { throw "Tauri NSIS installer exited with $($installerRun.ExitCode)" }
          try {
            if (-not (Test-Path -LiteralPath $appPath)) { throw "Installed Tauri executable is missing: $appPath" }
            if (-not (Test-Path -LiteralPath $uninstaller)) { throw "Tauri uninstaller is missing: $uninstaller" }
            cargo xtask builtin-catalog verify-installed --root (Join-Path $installRoot "builtin-songs")
            if ($LASTEXITCODE -ne 0) { throw "Installed built-in catalog verification failed with exit code $LASTEXITCODE" }
            $installedPe = @(Get-ChildItem -LiteralPath $installRoot -File -Recurse |
              Where-Object { $_.Extension.ToLowerInvariant() -in @('.exe', '.dll') -and $_.Name -ne 'uninstall.exe' })
            if ($installedPe.Count -eq 0) { throw "Installed Tauri tree contains no project PE files" }
            pwsh scripts/verify_v4_authenticode.ps1 `
              -Mode unsigned-zero-budget `
              -Artifact $installedPe.FullName `
              -Evidence rust/target/dist/INSTALLED_AUTHENTICODE_EVIDENCE.json
            if ($LASTEXITCODE -ne 0) { throw "Installed Authenticode verification failed with exit code $LASTEXITCODE" }
            $freshAppData = Join-Path $env:RUNNER_TEMP ("sky-auto-player-v4-fresh-appdata-" + [guid]::NewGuid().ToString("N"))
            $env:SKY_APP_DATA_ROOT = $freshAppData
            $env:SKY_BUILTIN_CATALOG_FRESH_SELFTEST = "1"
            try {
              $catalogSelftest = Start-Process -FilePath $appPath -ArgumentList @("--selftest-desktop-shell") -WindowStyle Hidden -Wait -PassThru
              if ($catalogSelftest.ExitCode -ne 0) { throw "Packaged built-in catalog self-test exited with $($catalogSelftest.ExitCode)" }
              $userSongs = @(Get-ChildItem -LiteralPath (Join-Path $freshAppData "songs") -File -Recurse -ErrorAction SilentlyContinue)
              if ($userSongs.Count -ne 0) { throw "Built-in catalog self-test populated the user songs directory" }
              "Packaged built-in catalog fresh-install self-test: PASS (user songs remain empty; user composition exercised)" | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
            } finally {
              Remove-Item Env:SKY_APP_DATA_ROOT -ErrorAction SilentlyContinue
              Remove-Item Env:SKY_BUILTIN_CATALOG_FRESH_SELFTEST -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $freshAppData) { Remove-Item -LiteralPath $freshAppData -Recurse -Force -ErrorAction SilentlyContinue }
            }
            $appProcess = Start-Process -FilePath $appPath -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 5
            if ($appProcess.HasExited) { throw "Packaged Tauri application exited during launch smoke (exit $($appProcess.ExitCode))" }
            Stop-Process -Id $appProcess.Id -Force
            $appProcess = $null
            $uninstallerRun = Start-Process -FilePath $uninstaller -ArgumentList @("/S") -WindowStyle Hidden -Wait -PassThru
            if ($uninstallerRun.ExitCode -ne 0) { throw "Tauri uninstaller exited with $($uninstallerRun.ExitCode)" }
            "Tauri NSIS install/launch/uninstall: PASS (installer=$($installerRun.ExitCode), uninstaller=$($uninstallerRun.ExitCode))" | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          } finally {
            if ($null -ne $appProcess -and -not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          }

      - name: Emit exact Tauri qualification evidence
        run: |
          $summary = Get-Content rust/target/dist/TAURI_ARTIFACT_SUMMARY.json -Raw | ConvertFrom-Json
          foreach ($field in @("installer_sha256", "updater_signature_sha256", "installer", "updater_signature", "version")) {
            if ([string]::IsNullOrWhiteSpace([string]$summary.$field)) {
              throw "Tauri artifact summary is missing qualification field: $field"
            }
          }
          $evidence = [ordered]@{
            schema_version = 1
            evidence_type = "tauri-nsis-qualified-release"
            qualified = $true
            qualification = "install-launch-uninstall"
            product_name = $summary.product_name
            identifier = $summary.identifier
            version = $summary.version
            target = $summary.target
            install_mode = $summary.install_mode
            installer = $summary.installer
            updater_signature = $summary.updater_signature
            installer_size = $summary.installer_size
            signature_size = $summary.signature_size
            installer_sha256 = $summary.installer_sha256
            updater_signature_sha256 = $summary.updater_signature_sha256
            authenticode_mode = "unsigned-zero-budget"
            authenticode_evidence = "TAURI_AUTHENTICODE_EVIDENCE.json"
            authenticode_evidence_sha256 = (Get-FileHash -LiteralPath rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json -Algorithm SHA256).Hash.ToLowerInvariant()
            sbom = "SBOM.spdx.json"
            sbom_sha256 = (Get-FileHash -LiteralPath rust/target/dist/SBOM.spdx.json -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath rust/target/dist/V4_QUALIFICATION_EVIDENCE.json -Encoding utf8

      - name: Clean up ephemeral Authenticode test certificate
        if: always()
        run: pwsh scripts/cleanup_v4_test_signing.ps1

      - name: Attest exact Tauri NSIS artifact set
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ github.workspace }}/rust/target/dist/bundle/nsis/*.exe
            ${{ github.workspace }}/rust/target/dist/bundle/nsis/*.sig

      - name: Attest exact Tauri SPDX SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ github.workspace }}/rust/target/dist/bundle/nsis/*.exe
          sbom-path: ${{ github.workspace }}/rust/target/dist/SBOM.spdx.json

      - name: Verify exact GitHub artifact attestations
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SKY_GH_PATH) -or
              -not (Test-Path -LiteralPath $env:SKY_GH_PATH -PathType Leaf)) {
            throw "GitHub CLI absolute path is unavailable for attestation verification"
          }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "GH_TOKEN is unavailable for attestation verification"
          }
          $attestationHelp = (& $env:SKY_GH_PATH attestation verify --help 2>&1 | Out-String)
          if ($attestationHelp -notmatch '--source-digest' -or
              $attestationHelp -notmatch '--signer-workflow') {
            throw "Installed GitHub CLI lacks the required exact-source attestation options"
          }
          $installer = Join-Path $env:SKY_TAURI_BUNDLE (Get-ChildItem -LiteralPath $env:SKY_TAURI_BUNDLE -Filter '*-setup.exe' -File).Name
          $signature = "$installer.sig"
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/ci.yml"
          & $env:SKY_GH_PATH attestation verify $installer -R $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "Installer attestation verification failed with exit code $LASTEXITCODE" }
          & $env:SKY_GH_PATH attestation verify $signature -R $env:GITHUB_REPOSITORY --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "Updater signature attestation verification failed with exit code $LASTEXITCODE" }
          & $env:SKY_GH_PATH attestation verify $installer -R $env:GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3 --source-digest $env:GITHUB_SHA --signer-workflow $signerWorkflow
          if ($LASTEXITCODE -ne 0) { throw "SBOM attestation verification failed with exit code $LASTEXITCODE" }

      - name: Upload exact Tauri NSIS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sky-auto-player-tauri-nsis-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            rust/target/dist/bundle/nsis
            rust/target/dist/TAURI_ARTIFACT_SUMMARY.json
            rust/target/dist/V4_QUALIFICATION_EVIDENCE.json
            rust/target/dist/TAURI_AUTHENTICODE_EVIDENCE.json
            rust/target/dist/INSTALLED_AUTHENTICODE_EVIDENCE.json
            rust/target/dist/SBOM.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job packaged -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  status:
    name: Sky Auto Player — required CI gate
    if: always()
    needs: [changes, static, release_contract, supply_chain, validate, updater_e2e, packaged]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        run: echo "SKY_CI_JOB_STARTED_STATUS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code_required }}
          PACKAGE_REQUIRED: ${{ needs.changes.outputs.package_required }}
          UPDATER_REQUIRED: ${{ needs.changes.outputs.updater_required }}
          RELEASE_REQUIRED: ${{ needs.changes.outputs.release_required }}
          SUPPLY_CHAIN_REQUIRED: ${{ needs.changes.outputs.supply_chain_required }}
          STATIC_RESULT: ${{ needs.static.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release_contract.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply_chain.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          UPDATER_E2E_RESULT: ${{ needs.updater_e2e.result }}
          PACKAGED_RESULT: ${{ needs.packaged.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          if [[ "$CODE_REQUIRED" == "true" || "$PACKAGE_REQUIRED" == "true" || "$UPDATER_REQUIRED" == "true" || "$RELEASE_REQUIRED" == "true" ]]; then
            [[ "$STATIC_RESULT" == "success" ]]
          else
            [[ "$STATIC_RESULT" == "skipped" ]]
          fi
          if [[ "$RELEASE_REQUIRED" == "true" ]]; then
            [[ "$RELEASE_CONTRACT_RESULT" == "success" ]]
          else
            [[ "$RELEASE_CONTRACT_RESULT" == "skipped" ]]
          fi
          if [[ "$SUPPLY_CHAIN_REQUIRED" == "true" ]]; then
            [[ "$SUPPLY_CHAIN_RESULT" == "success" ]]
          else
            [[ "$SUPPLY_CHAIN_RESULT" == "skipped" ]]
          fi
          if [[ "$CODE_REQUIRED" == "true" ]]; then [[ "$VALIDATE_RESULT" == "success" ]]; else [[ "$VALIDATE_RESULT" == "skipped" ]]; fi
          if [[ "$UPDATER_REQUIRED" == "true" ]]; then [[ "$UPDATER_E2E_RESULT" == "success" ]]; else [[ "$UPDATER_E2E_RESULT" == "skipped" ]]; fi
          if [[ "$PACKAGE_REQUIRED" == "true" ]]; then
            [[ "$PACKAGED_RESULT" == "success" ]]
          else
            [[ "$PACKAGED_RESULT" == "skipped" ]]
          fi
          echo "CI status is green."

      - name: Report CI timing
        if: always()
        run: |
          start_time="${SKY_CI_JOB_STARTED_STATUS:-}"
          if [ -n "$start_time" ]; then
            elapsed=$(( $(date +%s) - start_time ))
            {
              echo "## CI job timing"
              echo "- Job: \`status\`"
              echo "- Elapsed seconds: \`$elapsed\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
