name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    name: Classify validation layers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    outputs:
      static_required: ${{ steps.filter.outputs.static_required }}
      code_required: ${{ steps.filter.outputs.code_required }}
      package_required: ${{ steps.filter.outputs.package_required }}
      classification_reason: ${{ steps.filter.outputs.classification_reason }}

    steps:
      - name: Start CI timing
        shell: pwsh
        run: |
          "SKY_CI_JOB_STARTED_CHANGES=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            classification="$(printf '\n' | python scripts/classify_ci_changes.py --full)"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA" "$CURRENT_SHA")"
            classification="$(printf '%s\n' "$changed_files" | python scripts/classify_ci_changes.py)"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")"
            classification="$(printf '%s\n' "$changed_files" | python scripts/classify_ci_changes.py)"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            classification="$(printf '%s\n' "$changed_files" | python scripts/classify_ci_changes.py)"
          fi

          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$classification"
          {
            echo '## Validation classification'
            echo '```text'
            printf '%s\n' "$classification"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report CI timing
        if: always()
        shell: pwsh
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job changes

  static:
    name: Static and security gates
    needs: changes
    if: needs.changes.outputs.static_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        shell: pwsh
        run: |
          "SKY_CI_JOB_STARTED_STATIC=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "false"

      - name: Python dependency audit
        run: uv audit --frozen

      - name: RustSec dependency audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo audit --file rust/Cargo.lock

      - name: Repository verification — static
        run: uv run python scripts/check.py static

      - name: Report CI timing
        if: always()
        shell: pwsh
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job static

  validate:
    name: Windows compatibility and unit tests
    needs: changes
    if: needs.changes.outputs.code_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_VALIDATE=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Rust — install pinned stable toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify pinned stable toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 from rust/rust-toolchain.toml, got: $version"
          }

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-on-failure: true

      - name: Rust — build wheel
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          SKY_EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --env-file .env python scripts/build_rust_wheel.py --test-support --profile release

      - name: Repository verification — Rust
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: uv run python scripts/check.py rust

      - name: Repository verification — Python tests
        # Run windows-marked tests when present; skip only wall-clock `slow`.
        run: uv run python scripts/check.py tests

      - name: Set up Bun for desktop verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install Chromium for desktop browser smoke
        working-directory: desktop
        run: bunx playwright install chromium

      - name: Repository verification — desktop
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: uv run python scripts/check.py desktop

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job validate -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  packaged:
    name: Packaged frozen unsigned app smoke
    needs: changes
    if: needs.changes.outputs.package_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_PACKAGED=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Rust — install pinned stable toolchain for packaged build
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy

      - name: Rust — verify packaged-build compiler
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 for packaged build, got: $version"
          }

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-on-failure: true

      - name: Build source PyInstaller bootloader
        run: |
          $bootloader = Join-Path $env:RUNNER_TEMP "sky-auto-player-pyinstaller-bootloader"
          pwsh -NoProfile -File scripts/build_pyinstaller_bootloader.ps1 -OutputDirectory $bootloader
          "SKY_SOURCE_BOOTLOADER_DIR=$bootloader" | Add-Content $env:GITHUB_ENV -Encoding ASCII
          "SKY_REQUIRE_SOURCE_BOOTLOADER=1" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Set up Bun for production frontend build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Build and qualify exact portable artifact
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          SKY_EXPECTED_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Sky Auto Player portable"
          uv run --env-file .env python scripts/build_portable_release.py --output-root $output
          "SKY_PORTABLE_OUTPUT=$output" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Verify packaged release tree
        run: |
          $version = uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          uv run --env-file .env python scripts/verify_release_manifest.py `
            --release-dir (Join-Path $env:SKY_PORTABLE_OUTPUT "Sky-Auto-Player-v$version") --version $version

      - name: Report exact portable artifact identity
        shell: pwsh
        run: |
          $summary = Get-Content (Join-Path $env:SKY_PORTABLE_OUTPUT "PORTABLE_ARTIFACT_SUMMARY.json") -Raw | ConvertFrom-Json
          @"
          ## Exact portable artifact
          - repo head: ``$($summary.repo_head)``
          - ZIP: ``$($summary.artifact_name)`` ($($summary.artifact_size) bytes)
          - ZIP SHA-256: ``$($summary.artifact_sha256)``
          - MANIFEST SHA-256: ``$($summary.manifest_sha256)``
          - portable files: $($summary.portable_file_count)
          - managed entries: $($summary.managed_entry_count)
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Get-Content (Join-Path $env:SKY_PORTABLE_OUTPUT "PROVENANCE.json")

      - name: Upload exact portable release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sky-auto-player-portable-v${{ hashFiles('pyproject.toml') }}
          path: ${{ runner.temp }}/Sky Auto Player portable
          if-no-files-found: error
          retention-days: 14

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job packaged -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"

  status:
    name: Sky Auto Player — required CI gate
    if: always()
    needs: [changes, static, validate, packaged]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Start CI timing
        shell: pwsh
        run: |
          "SKY_CI_JOB_STARTED_STATUS=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Require relevant gates to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_REQUIRED: ${{ needs.changes.outputs.static_required }}
          CODE_REQUIRED: ${{ needs.changes.outputs.code_required }}
          PACKAGE_REQUIRED: ${{ needs.changes.outputs.package_required }}
          STATIC_RESULT: ${{ needs.static.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGED_RESULT: ${{ needs.packaged.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          if [[ "$STATIC_REQUIRED" == "true" ]]; then [[ "$STATIC_RESULT" == "success" ]]; else [[ "$STATIC_RESULT" == "skipped" ]]; fi
          if [[ "$CODE_REQUIRED" == "true" ]]; then [[ "$VALIDATE_RESULT" == "success" ]]; else [[ "$VALIDATE_RESULT" == "skipped" ]]; fi
          if [[ "$PACKAGE_REQUIRED" == "true" ]]; then [[ "$PACKAGED_RESULT" == "success" ]]; else [[ "$PACKAGED_RESULT" == "skipped" ]]; fi
          echo "CI status is green."

      - name: Report CI timing
        if: always()
        shell: pwsh
        run: |
          $startedAt = [DateTimeOffset]::Parse($env:SKY_CI_JOB_STARTED_STATUS)
          $elapsedSeconds = [math]::Round(([DateTimeOffset]::UtcNow - $startedAt).TotalSeconds, 2)
          @"
          ## CI job timing
          - Job: ``status``
          - Elapsed seconds: ``$elapsedSeconds``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8
