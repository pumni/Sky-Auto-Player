name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: pwsh

env:
  FORCE_COLOR: "1"

jobs:
  release:
    name: Build + attest + publish
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Types — pyright
        run: uv run pyright

      - name: Security — AGENTS.md P0 audit
        run: uv run --env-file .env python scripts/audit_security_mandates.py

      - name: Rust — format, lint, tests, and native wheel
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo check --manifest-path rust/Cargo.toml --workspace --all-targets --all-features
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --workspace --all-features
          uv run --env-file .env python scripts/build_rust_wheel.py

      - name: Tests — full
        run: uv run pytest

      - name: Assert tag version equals pyproject.toml
        id: verlock
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(.+)$') { throw "Tag must look like vX.Y.Z[-suffix], got: $tag" }
          $tagVer = $Matches[1]
          $pyVer = uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($tagVer -ne $pyVer) {
            throw "I48 fail: tag version '$tagVer' != pyproject version '$pyVer'. Bump pyproject.toml before tagging."
          }
          Write-Host "Version lock OK: $tagVer"
          # Compute prerelease flag using the SAME PEP 440 parser the in-app
          # update checker uses (sky_music.domain.update_checker imports
          # packaging.version.Version), so the GitHub Release's prerelease
          # bit agrees with `is_prerelease` in src/sky_music/domain/
          # update_checker.py. The previous substring match
          # (`contains(github.ref_name, '-rc') || contains('-beta')`)
          # missed `-alpha` / `-dev` / `-a` / `-b` — packaging would have
          # flagged those as prerelease, so they would have been silently
          # promoted to stable channel via /releases/latest and picked up
          # by the external updater's stable selector.
          $isPre = uv run python -c "from packaging.version import Version; print('true' if Version('$tagVer').is_prerelease else 'false')"
          Write-Host "is_prerelease: $isPre"
          "version=$tagVer"       | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII
          # `Add-Content` (not `Set-Content -Append`) — `Set-Content` has no
          # `-Append` parameter in PowerShell 7; the previous form failed the
          # v2.4.0 release run (29657111725) at this step.
          "is_prerelease=$isPre"  | Add-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Verify production signing configuration
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
          AUTHENTICODE_CERT_THUMBPRINT: ${{ secrets.AUTHENTICODE_CERT_THUMBPRINT }}
          EXPECTED_PUBLISHER_SUBJECT: ${{ secrets.EXPECTED_PUBLISHER_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_CERT_THUMBPRINT) -or
              [string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER_SUBJECT)) {
            throw "Production release is blocked: encrypted PFX, PFX password, certificate thumbprint, and publisher subject are required."
          }

      - name: Provision production Authenticode identity
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
          AUTHENTICODE_CERT_THUMBPRINT: ${{ secrets.AUTHENTICODE_CERT_THUMBPRINT }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "sky-auto-player-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:AUTHENTICODE_PFX_BASE64))
            $password = ConvertTo-SecureString $env:AUTHENTICODE_PFX_PASSWORD -AsPlainText -Force
            Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password | Out-Null
            $thumbprint = ($env:AUTHENTICODE_CERT_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            $certificate = Get-ChildItem Cert:\CurrentUser\My | Where-Object Thumbprint -eq $thumbprint
            if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
              throw "Provisioned certificate thumbprint is missing or has no private key."
            }
            Write-Host "Production Authenticode identity provisioned in the ephemeral runner store."
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build matching PyInstaller bootloader from source
        run: |
          $bootloader = Join-Path $env:RUNNER_TEMP "sky-auto-player-pyinstaller-bootloader"
          pwsh -NoProfile -File scripts/build_pyinstaller_bootloader.ps1 -OutputDirectory $bootloader
          "SKY_SOURCE_BOOTLOADER_DIR=$bootloader" | Add-Content $env:GITHUB_ENV -Encoding ASCII
          "SKY_REQUIRE_SOURCE_BOOTLOADER=1" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Build native app, updater, and smoke tests
        env:
          SKY_PUBLISHER_SUBJECT: ${{ secrets.EXPECTED_PUBLISHER_SUBJECT }}
        run: uv run --env-file .env python -m build_app

      - name: Sign project-owned PE files
        env:
          AUTHENTICODE_CERT_THUMBPRINT: ${{ secrets.AUTHENTICODE_CERT_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTHENTICODE_CERT_THUMBPRINT)) {
            throw "Production release is blocked: AUTHENTICODE_CERT_THUMBPRINT is not configured."
          }
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($null -eq $signtool) { throw "Production release is blocked: signtool.exe is unavailable." }
          $ver = "${{ steps.verlock.outputs.version }}"
          $rel = (Resolve-Path "dist\Sky-Auto-Player-v$ver").Path
          $targets = @(
            (Join-Path $rel "Sky-Auto-Player.exe"),
            (Join-Path $rel "Sky-Auto-Player-Updater.exe"),
            (Join-Path $rel "native_calibration.exe")
          )
          $pyds = @(Get-ChildItem (Join-Path $rel "_internal") -Recurse -Filter "sky_player_rs*.pyd" -File | ForEach-Object { $_.FullName })
          if ($pyds.Count -eq 0) { throw "Missing project-owned sky_player_rs*.pyd signing target." }
          $targets += $pyds
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Missing signing target: $target" }
            & $signtool.Source sign /sha1 $env:AUTHENTICODE_CERT_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          }

      - name: Verify project-owned PE signatures
        env:
          EXPECTED_PUBLISHER_SUBJECT: ${{ secrets.EXPECTED_PUBLISHER_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER_SUBJECT)) {
            throw "Production release is blocked: EXPECTED_PUBLISHER_SUBJECT is not configured."
          }
          $ver = "${{ steps.verlock.outputs.version }}"
          pwsh -NoProfile -File scripts/verify_release_signatures.ps1 `
            -ReleaseDirectory "dist\Sky-Auto-Player-v$ver" `
            -ExpectedPublisherSubject $env:EXPECTED_PUBLISHER_SUBJECT

      - name: Generate post-sign manifest
        run: uv run --env-file .env python -m build_app --manifest-only

      - name: Verify exact release tree and manifest
        run: |
          $ver = "${{ steps.verlock.outputs.version }}"
          uv run --env-file .env python scripts/verify_release_manifest.py `
            --release-dir "dist\Sky-Auto-Player-v$ver" --version $ver

      - name: Stage release assets
        id: stage
        run: |
          $ver = "${{ steps.verlock.outputs.version }}"
          $rel = "dist\Sky-Auto-Player-v$ver"
          if (-not (Test-Path $rel)) { throw "Missing release dir: $rel" }

          # Canonical
          Compress-Archive -Path (Join-Path $rel '*') -DestinationPath "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip" -Force
          $h = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip").Hash
          "$h  Sky-Auto-Player-v$ver.zip" | Set-Content "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip.sha256" -Encoding ASCII
          Copy-Item "$rel\MANIFEST.json" "$env:RUNNER_TEMP\MANIFEST.json"

          "version=$ver" | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Assert all assets exist
        run: |
          $ver = "${{ steps.stage.outputs.version }}"
          $required = @(
            "Sky-Auto-Player-v$ver.zip",
            "Sky-Auto-Player-v$ver.zip.sha256",
            "MANIFEST.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path "$env:RUNNER_TEMP\$file")) {
              throw "Missing required release asset: $file"
            }
          }
          Write-Host "All required assets exist in RUNNER_TEMP."

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json
          body_path: docs/releases/v${{ steps.stage.outputs.version }}-release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.verlock.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
