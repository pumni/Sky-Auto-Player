name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: pwsh

env:
  FORCE_COLOR: "1"

jobs:
  release:
    name: Build + attest + publish
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Types — pyright
        run: uv run pyright

      - name: Security — AGENTS.md P0 audit
        run: uv run --env-file .env python scripts/audit_security_mandates.py

      - name: Tests — full
        run: uv run pytest

      - name: Pester — installer/updater.ps1 tests
        timeout-minutes: 10
        run: |
          # Pester 5.x is required — the test file uses `BeforeAll`/`AfterAll`
          # at the top of a wrapper Describe block, and root-level setup is
          # deprecated in Pester 6. Pin 5.9.0 exactly for reproducible CI.
          Install-Module Pester -RequiredVersion 5.9.0 `
            -Force -Scope CurrentUser -AcceptLicense
          Import-Module Pester -RequiredVersion 5.9.0 -ErrorAction Stop
          $r = Invoke-Pester -Path .\installer\Tests\updater.Tests.ps1 -PassThru
          if ($r.FailedCount -gt 0) {
            Write-Host "::error::Pester failed: $($r.FailedCount) of $($r.TotalCount) tests"
            $r.Tests | Where-Object { $_.Result -ne 'Passed' } | ForEach-Object {
              Write-Host ("  - " + $_.Path + " :: " + $_.ErrorRecord.Exception.Message)
            }
            exit 1
          }
          Write-Host "Pester OK: $($r.PassedCount)/$($r.TotalCount) tests passed"

      - name: Parse installer/updater.ps1 on Windows PowerShell 5.1
        shell: powershell
        run: |
          # Keep this inline script ASCII-only: Windows PowerShell 5.1 can
          # misread a UTF-8 workflow temp script without a BOM.
          $ps1 = Join-Path -Path (Get-Location).Path -ChildPath 'installer\updater.ps1'
          if (-not (Test-Path -LiteralPath $ps1)) {
            Write-Host "::error::Missing updater script: $ps1"
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($ps1)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            Write-Host "::error::installer/updater.ps1 must start with a UTF-8 BOM for the Windows PowerShell 5.1 fallback."
            exit 1
          }
          $errs = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$tokens, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            Write-Host "::error::installer/updater.ps1 failed to parse on Windows PowerShell 5.1."
            $errs | ForEach-Object {
              Write-Host ("  line {0} col {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            exit 1
          }
          Write-Host "Windows PowerShell 5.1 parser OK."


      - name: Rust wheel precheck (only when rust/ exists)
        run: |
          if (Test-Path rust) {
            uv run --env-file .env python scripts/build_rust_wheel.py
          } else {
            Write-Host "rust/ absent — skipping rust precheck (no-op per AGENTS.md §Build Environment)."
          }

      - name: Assert tag version equals pyproject.toml
        id: verlock
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(.+)$') { throw "Tag must look like vX.Y.Z[-suffix], got: $tag" }
          $tagVer = $Matches[1]
          $pyVer = uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($tagVer -ne $pyVer) {
            throw "I48 fail: tag version '$tagVer' != pyproject version '$pyVer'. Bump pyproject.toml before tagging."
          }
          Write-Host "Version lock OK: $tagVer"
          # Compute prerelease flag using the SAME PEP 440 parser the in-app
          # update checker uses (sky_music.domain.update_checker imports
          # packaging.version.Version), so the GitHub Release's prerelease
          # bit agrees with `is_prerelease` in src/sky_music/domain/
          # update_checker.py. The previous substring match
          # (`contains(github.ref_name, '-rc') || contains('-beta')`)
          # missed `-alpha` / `-dev` / `-a` / `-b` — packaging would have
          # flagged those as prerelease, so they would have been silently
          # promoted to stable channel via /releases/latest and picked up
          # by the external updater's stable selector.
          $isPre = uv run python -c "from packaging.version import Version; print('true' if Version('$tagVer').is_prerelease else 'false')"
          Write-Host "is_prerelease: $isPre"
          "version=$tagVer"       | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII
          # `Add-Content` (not `Set-Content -Append`) — `Set-Content` has no
          # `-Append` parameter in PowerShell 7; the previous form failed the
          # v2.4.0 release run (29657111725) at this step.
          "is_prerelease=$isPre"  | Add-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Build + manifest + smoke test
        run: uv run --env-file .env python -m build_app --manifest

      - name: Stage release assets
        id: stage
        run: |
          $ver = "${{ steps.verlock.outputs.version }}"
          $rel = "dist\Sky-Auto-Player-v$ver"
          if (-not (Test-Path $rel)) { throw "Missing release dir: $rel" }
          
          # Canonical
          Compress-Archive -Path (Join-Path $rel '*') -DestinationPath "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip" -Force
          $h = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip").Hash
          "$h  Sky-Auto-Player-v$ver.zip" | Set-Content "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip.sha256" -Encoding ASCII
          Copy-Item "$rel\MANIFEST.json" "$env:RUNNER_TEMP\MANIFEST.json"
          
          # Legacy bridge — temporary dual-publish to migrate pre-2.4.2
          # "Sky-Player" installs onto the new "Sky Auto Player" brand.
          # See docs/plan/2026-07-24_rename-update-cutover-v2.4.2-plan.md §3 D3:
          # remove dual-publish no earlier than the first 2.5.0 release, and
          # only after CHANGELOG + distribution doc announce the sunset
          # (>= 30 days notice preferred).
          $bridge = "dist\Sky-Player-v$ver-bridge"
          if (-not (Test-Path $bridge)) { throw "Missing bridge release dir: $bridge" }
          Compress-Archive -Path (Join-Path $bridge '*') -DestinationPath "$env:RUNNER_TEMP\Sky-Player-v$ver.zip" -Force
          $hBridge = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\Sky-Player-v$ver.zip").Hash
          "$hBridge  Sky-Player-v$ver.zip" | Set-Content "$env:RUNNER_TEMP\Sky-Player-v$ver.zip.sha256" -Encoding ASCII
          
          "version=$ver" | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Assert all assets exist
        run: |
          $ver = "${{ steps.stage.outputs.version }}"
          $required = @(
            "Sky-Auto-Player-v$ver.zip",
            "Sky-Auto-Player-v$ver.zip.sha256",
            "Sky-Player-v$ver.zip",
            "Sky-Player-v$ver.zip.sha256",
            "MANIFEST.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path "$env:RUNNER_TEMP\$file")) {
              throw "Missing required release asset: $file"
            }
          }
          Write-Host "All required assets exist in RUNNER_TEMP."

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/Sky-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/Sky-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.verlock.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
