name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: pwsh

env:
  FORCE_COLOR: "1"

jobs:
  release:
    name: Build + attest + draft
    runs-on: windows-latest
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/python-environment
        with:
          run-runtime-audit: "true"

      - name: Repository verification — static
        run: uv run python scripts/check.py static

      - name: Rust — install and verify pinned stable toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 from rust/rust-toolchain.toml, got: $version"
          }

      - name: Repository verification — Rust
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: uv run python scripts/check.py rust

      - name: Rust — build native wheel
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: uv run --env-file .env python scripts/build_rust_wheel.py

      - name: Repository verification — full Python tests
        run: uv run python scripts/check.py tests-full

      - name: Assert tag version equals pyproject.toml
        id: verlock
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(.+)$') { throw "Tag must look like vX.Y.Z[-suffix], got: $tag" }
          $tagVer = $Matches[1]
          $pyVer = uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($tagVer -ne $pyVer) {
            throw "I48 fail: tag version '$tagVer' != pyproject version '$pyVer'. Bump pyproject.toml before tagging."
          }
          Write-Host "Version lock OK: $tagVer"
          # Compute prerelease flag using the SAME PEP 440 parser the in-app
          # update checker uses (sky_music.domain.update_checker imports
          # packaging.version.Version), so the GitHub Release's prerelease
          # bit agrees with `is_prerelease` in src/sky_music/domain/
          # update_checker.py. The previous substring match
          # (`contains(github.ref_name, '-rc') || contains('-beta')`)
          # missed `-alpha` / `-dev` / `-a` / `-b` — packaging would have
          # flagged those as prerelease, so they would have been silently
          # promoted to stable channel via /releases/latest and picked up
          # by the bundled native updater's stable selector.
          $isPre = uv run python -c "from packaging.version import Version; print('true' if Version('$tagVer').is_prerelease else 'false')"
          Write-Host "is_prerelease: $isPre"
          "version=$tagVer"       | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII
          # `Add-Content` (not `Set-Content -Append`) — `Set-Content` has no
          # `-Append` parameter in PowerShell 7; the previous form failed the
          # v2.4.0 release run (29657111725) at this step.
          "is_prerelease=$isPre"  | Add-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Build matching PyInstaller bootloader from source
        run: |
          $bootloader = Join-Path $env:RUNNER_TEMP "sky-auto-player-pyinstaller-bootloader"
          pwsh -NoProfile -File scripts/build_pyinstaller_bootloader.ps1 -OutputDirectory $bootloader
          "SKY_SOURCE_BOOTLOADER_DIR=$bootloader" | Add-Content $env:GITHUB_ENV -Encoding ASCII
          "SKY_REQUIRE_SOURCE_BOOTLOADER=1" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Set up Bun for production frontend build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Build and qualify exact portable release candidate
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Sky Auto Player Phase8"
          uv run --env-file .env python scripts/build_phase8.py --output-root $output
          "SKY_PHASE8_OUTPUT=$output" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Verify exact release tree and manifest
        run: |
          $ver = "${{ steps.verlock.outputs.version }}"
          $rel = Join-Path $env:SKY_PHASE8_OUTPUT "Sky-Auto-Player-v$ver"
          uv run --env-file .env python scripts/verify_release_manifest.py `
            --release-dir $rel --version $ver
          $e2e = Get-ChildItem $rel -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "sky_updater_e2e*" }
          if ($e2e) { throw "E2E updater artifacts must never enter the public release tree: $($e2e.FullName -join ', ')" }

      - name: Stage release assets
        id: stage
        run: |
          $ver = "${{ steps.verlock.outputs.version }}"
          $artifact = Join-Path $env:SKY_PHASE8_OUTPUT "Sky-Auto-Player-v$ver.zip"
          $sidecar = "$artifact.sha256"
          $manifest = Join-Path $env:SKY_PHASE8_OUTPUT "MANIFEST.json"
          $provenance = Join-Path $env:SKY_PHASE8_OUTPUT "PROVENANCE.json"
          foreach ($path in @($artifact, $sidecar, $manifest, $provenance)) {
            if (-not (Test-Path $path)) { throw "Missing exact Phase 8 release asset: $path" }
          }
          Copy-Item $artifact "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip"
          Copy-Item $sidecar "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip.sha256"
          Copy-Item $manifest "$env:RUNNER_TEMP\MANIFEST.json"
          Copy-Item $provenance "$env:RUNNER_TEMP\PROVENANCE.json"

          "version=$ver" | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Assert all assets exist
        run: |
          $ver = "${{ steps.stage.outputs.version }}"
          $required = @(
            "Sky-Auto-Player-v$ver.zip",
            "Sky-Auto-Player-v$ver.zip.sha256",
            "MANIFEST.json",
            "PROVENANCE.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path "$env:RUNNER_TEMP\$file")) {
              throw "Missing required release asset: $file"
            }
          }
          Write-Host "All required assets exist in RUNNER_TEMP."

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json
            ${{ runner.temp }}/PROVENANCE.json

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json
            ${{ runner.temp }}/PROVENANCE.json
          body_path: docs/releases/v${{ steps.stage.outputs.version }}-release-notes.md
          generate_release_notes: false
          # Every release starts as a draft. Publish only the exact artifact that
          # has completed RC/stable qualification; never rebuild between states.
          draft: true
          prerelease: ${{ steps.verlock.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
