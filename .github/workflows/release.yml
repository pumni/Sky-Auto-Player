name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: pwsh

env:
  FORCE_COLOR: "1"

jobs:
  release:
    name: Build + attest + draft
    runs-on: windows-latest
    timeout-minutes: 100

    steps:
      - name: Start CI timing
        run: |
          "SKY_CI_JOB_STARTED_RELEASE=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content $env:GITHUB_ENV -Encoding ASCII

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust — install and verify pinned stable toolchain
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt --component clippy
          $version = (rustc --version)
          if ($version -notmatch '^rustc 1\.98\.0\s') {
            throw "Expected stable Rust 1.98.0 from rust/rust-toolchain.toml, got: $version"
          }

      - name: Repository verification — static
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check static

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
          cache-on-failure: true

      - name: Repository verification — Rust
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: cargo xtask check rust

      - name: Assert tag version equals native Cargo package
        id: verlock
        run: |
          $tag = $env:GITHUB_REF_NAME
          $lines = @(cargo xtask version check --tag $tag)
          if ($LASTEXITCODE -ne 0) { throw "Rust version qualification failed for tag $tag" }
          $versionLine = $lines | Where-Object { $_ -match '^version=' } | Select-Object -Last 1
          $preLine = $lines | Where-Object { $_ -match '^is_prerelease=' } | Select-Object -Last 1
          if (-not $versionLine -or -not $preLine) { throw "xtask did not emit structured version output" }
          $tagVer = $versionLine -replace '^version=', ''
          $isPre = $preLine -replace '^is_prerelease=', ''
          Write-Host "Version lock OK: $tagVer (is_prerelease=$isPre)"
          "version=$tagVer" | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII
          "is_prerelease=$isPre" | Add-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Set up Bun for production frontend build
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Build and qualify exact portable release candidate
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Sky Auto Player portable"
          cargo xtask dist --profile dist --output $output
          "SKY_PORTABLE_OUTPUT=$output" | Add-Content $env:GITHUB_ENV -Encoding UTF8

      - name: Verify exact release tree and manifest
        run: |
          $ver = "${{ steps.verlock.outputs.version }}"
          $rel = Join-Path $env:SKY_PORTABLE_OUTPUT "Sky-Auto-Player-v$ver"
          cargo xtask verify-dist --release-dir $rel
          $e2e = Get-ChildItem $rel -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "sky_updater_e2e*" }
          if ($e2e) { throw "E2E updater artifacts must never enter the public release tree: $($e2e.FullName -join ', ')" }

      - name: Stage release assets
        id: stage
        run: |
          $ver = "${{ steps.verlock.outputs.version }}"
          $artifact = Join-Path $env:SKY_PORTABLE_OUTPUT "Sky-Auto-Player-v$ver.zip"
          $sidecar = "$artifact.sha256"
          $manifest = Join-Path $env:SKY_PORTABLE_OUTPUT "MANIFEST.json"
          $provenance = Join-Path $env:SKY_PORTABLE_OUTPUT "PROVENANCE.json"
          foreach ($path in @($artifact, $sidecar, $manifest, $provenance)) {
            if (-not (Test-Path $path)) { throw "Missing exact portable release asset: $path" }
          }
          Copy-Item $artifact "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip"
          Copy-Item $sidecar "$env:RUNNER_TEMP\Sky-Auto-Player-v$ver.zip.sha256"
          Copy-Item $manifest "$env:RUNNER_TEMP\MANIFEST.json"
          Copy-Item $provenance "$env:RUNNER_TEMP\PROVENANCE.json"

          "version=$ver" | Set-Content $env:GITHUB_OUTPUT -Encoding ASCII

      - name: Assert all assets exist
        run: |
          $ver = "${{ steps.stage.outputs.version }}"
          $required = @(
            "Sky-Auto-Player-v$ver.zip",
            "Sky-Auto-Player-v$ver.zip.sha256",
            "MANIFEST.json",
            "PROVENANCE.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path "$env:RUNNER_TEMP\$file")) {
              throw "Missing required release asset: $file"
            }
          }
          Write-Host "All required assets exist in RUNNER_TEMP."

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json
            ${{ runner.temp }}/PROVENANCE.json

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip
            ${{ runner.temp }}/Sky-Auto-Player-v${{ steps.stage.outputs.version }}.zip.sha256
            ${{ runner.temp }}/MANIFEST.json
            ${{ runner.temp }}/PROVENANCE.json
          body_path: docs/releases/v${{ steps.stage.outputs.version }}-release-notes.md
          generate_release_notes: false
          # Every release starts as a draft. Publish only the exact artifact that
          # has completed RC/stable qualification; never rebuild between states.
          draft: true
          prerelease: ${{ steps.verlock.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report CI timing
        if: always()
        run: pwsh scripts/ci_job_timing.ps1 -Mode finish -Job release -CacheHit "${{ steps.rust-cache.outputs.cache-hit }}"
