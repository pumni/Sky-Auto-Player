name: Legacy v3 Release (retired)

on:
  workflow_dispatch:

# The v3 source-repository release workflow is retired. Historical v3 tags
# and releases remain available, but this workflow cannot build or publish
# current products. WO-07 owns the future v4 release state machine.
jobs:
  retired:
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - name: Retired legacy release workflow
        run: |
          throw "The legacy v3 release workflow is retired; use the dedicated v4 release authority."

# Permanent namespace guard: v4 publication belongs only to the dedicated
# authority, never to the legacy source-repository Releases API.
