name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/faq.html"
      - "docs/vi/index.html"
      - "docs/vi/faq.html"
      - "docs/assets/**"
      - "docs/sitemap.xml"
      - "docs/llms.txt"
      - "docs/google*.html"
      - "docs/.nojekyll"
      - "scripts/build_pages_site.ps1"
      - "scripts/validate_pages_site.ps1"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/faq.html"
      - "docs/vi/index.html"
      - "docs/vi/faq.html"
      - "docs/assets/**"
      - "docs/sitemap.xml"
      - "docs/llms.txt"
      - "docs/google*.html"
      - "docs/.nojekyll"
      - "scripts/build_pages_site.ps1"
      - "scripts/validate_pages_site.ps1"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build allowlisted Pages artifact
        shell: pwsh
        run: >-
          ./scripts/build_pages_site.ps1
          -Source docs
          -Destination _site

      - name: Validate Pages source and artifact
        shell: pwsh
        run: >-
          ./scripts/validate_pages_site.ps1
          -Source docs
          -Artifact _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy marketing site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
