version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns:
          - packaging
          - pyrefly
          - pyright
          - pytest
          - pytest-benchmark
          - ruff

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    groups:
      cargo-regular:
        patterns:
          - serde
          - serde_json
          - thiserror
          - smallvec
          - crossbeam-queue
          - parking_lot
          - proptest
          - pep440_rs
        update-types:
          - patch
          - minor
      cargo-major-zip:
        patterns:
          - zip
        update-types:
          - major
      cargo-major-sha2:
        patterns:
          - sha2
        update-types:
          - major
      cargo-major-windows-sys:
        patterns:
          - windows-sys
        update-types:
          - major

  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-major-technologies:
        patterns:
          - typescript
        update-types:
          - major
      site-regular:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-security:
        patterns:
          - actions/attest-build-provenance
      github-actions:
        patterns:
          - '*'
        exclude-patterns:
          - actions/attest-build-provenance
