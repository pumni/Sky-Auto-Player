version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns:
          - packaging
          - rapidfuzz
          - textual
      python-tooling:
        patterns:
          - maturin
          - pyrefly
          - pyright
          - pytest
          - pytest-benchmark
          - pytest-textual-snapshot
          - ruff
          - soundcard
      python-packaging:
        patterns:
          - pyinstaller
          - pyinstaller-hooks-contrib

  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-major-technologies:
        patterns:
          - typescript
        update-types:
          - major
      site-regular:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-security:
        patterns:
          - actions/attest-build-provenance
      github-actions:
        patterns:
          - '*'
        exclude-patterns:
          - actions/attest-build-provenance
