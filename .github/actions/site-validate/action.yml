name: Site validate
description: >
  Install site dependencies with Bun and run check, lint, format, build,
  dist verify, and Playwright e2e/accessibility tests under site/.

runs:
  using: composite
  steps:
    - name: Set up Bun
      # Version is pinned via site/package.json `packageManager` field
      # (single source of truth).
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

    - name: Install dependencies
      shell: bash
      working-directory: site
      run: bun install --frozen-lockfile

    - name: Type and Astro checks
      shell: bash
      working-directory: site
      run: bun run check

    - name: Lint
      shell: bash
      working-directory: site
      run: bun run lint

    - name: Formatting
      shell: bash
      working-directory: site
      run: bun run format:check

    - name: Build static site
      shell: bash
      working-directory: site
      run: bun run build

    - name: Verify required output
      shell: bash
      working-directory: site
      run: bun run verify:dist

    - name: Verify SEO contracts
      shell: bash
      working-directory: site
      run: bun run verify:seo

    - name: Install Playwright Chromium
      shell: bash
      working-directory: site
      run: bunx playwright install chromium --with-deps

    - name: Run Functional E2E and accessibility tests
      shell: bash
      working-directory: site
      env:
        CI: true
      run: bun run test:functional

    - name: Run Visual regression tests
      shell: bash
      working-directory: site
      env:
        CI: true
      run: bun run test:visual

    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@4bec8e081f65027303d8ba4f652030f2430349f2 # v4.6.1
      with:
        name: playwright-failure-${{ github.run_id }}
        path: |
          site/test-results/
          site/playwright-report/
        if-no-files-found: ignore
        retention-days: 7
