name: Site validate
description: >
  Install site dependencies with Bun, validate the published-release snapshot, and run check, lint,
  format, build, SEO/dist verification, and Playwright e2e/accessibility tests under apps/website/.

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version

    - name: Verify installed Bun pin
      shell: bash
      run: bun scripts/verify-bun-pin.mjs

    - name: Install dependencies
      shell: bash
      working-directory: apps/website
      run: bun install --frozen-lockfile

    - name: Validate published release metadata
      shell: bash
      working-directory: apps/website
      run: bun run test:unit

    - name: Type and Astro checks
      shell: bash
      working-directory: apps/website
      run: bun run check

    - name: Lint
      shell: bash
      working-directory: apps/website
      run: bun run lint

    - name: Formatting
      shell: bash
      working-directory: apps/website
      run: bun run format:check

    - name: Build static site
      shell: bash
      working-directory: apps/website
      run: bun run build

    - name: Verify required output
      shell: bash
      working-directory: apps/website
      run: bun run verify:dist

    - name: Verify SEO contracts
      shell: bash
      working-directory: apps/website
      run: bun run verify:seo

    - name: Install Playwright Chromium
      shell: bash
      working-directory: apps/website
      run: bunx playwright install chromium --with-deps

    - name: Run Functional E2E and accessibility tests
      shell: bash
      working-directory: apps/website
      env:
        CI: true
      run: bun run test:functional

    - name: Upload Playwright failure artifacts
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-failure-${{ github.run_id }}
        path: |
          apps/website/test-results/
          apps/website/playwright-report/
        if-no-files-found: ignore
        retention-days: 7
