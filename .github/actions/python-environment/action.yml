name: Sky Auto Player Python environment
description: Install the pinned free-threaded Python toolchain and sync locked dependencies.

inputs:
  run-runtime-audit:
    description: Run the free-threaded wheel readiness audit after syncing dependencies.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        # Keep in sync with repo-root `.python-version` (free-threaded pin).
        # setup-uv sets UV_PYTHON so every later `uv` invocation resolves the
        # same interpreter; `uv sync` still re-reads `.python-version` as a
        # second source of truth.
        python-version: "3.14.7+freethreaded"

    - name: Materialize .env
      shell: pwsh
      run: |
        New-Item -ItemType File -Force -Path .env | Out-Null
        Copy-Item -Force .env.example .env

    - name: Sync deps (frozen)
      shell: pwsh
      run: uv sync --frozen

    - name: Runtime audit — free-threaded readiness
      if: inputs.run-runtime-audit == 'true'
      shell: pwsh
      run: uv run --env-file .env python scripts/audit_free_threaded_wheels.py
