name: Sky Auto Player Python tooling environment
description: Install the pinned Python tooling interpreter and sync repository-only dependencies.

inputs:
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        # Keep in sync with repo-root `.python-version` (tooling pin).
        # setup-uv sets UV_PYTHON so every later `uv` invocation resolves the
        # same interpreter; `uv sync` still re-reads `.python-version` as a
        # second source of truth.
        python-version: "3.14.7"

    - name: Materialize .env
      shell: pwsh
      run: |
        New-Item -ItemType File -Force -Path .env | Out-Null
        Copy-Item -Force .env.example .env

    - name: Sync deps (frozen)
      shell: pwsh
      run: uv sync --frozen
