  <text x="48" y="48" fill="#F4EFE3" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">Sky Auto Player · actual-size icon evidence</text>
  <text x="48" y="84" fill="#B8CCD6" font-family="Segoe UI, sans-serif" font-size="16">Large master: 256 / 128 / 64 / 48 / 32 px · small master: 24 px · dedicated 16 px master</text>
  <text x="48" y="128" fill="#F7DDA2" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">DARK BACKGROUND</text>
  <text x="48" y="494" fill="#07090D" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">LIGHT BACKGROUND</text>

