[project]
name = "sky-auto-player-repository-tools"
version = "0.0.0"
description = "Repository-only verification and release tooling for the native application"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[dependency-groups]
dev = [
    "packaging>=26.3",
    "pyrefly>=1.2.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.16.5",
]

[tool.pyright]
# ── Analysis scope ──────────────────────────────────────────────────────
# Standard mode keeps repository-tooling diagnostics useful without making
# third-party library stubs a product build dependency.
typeCheckingMode = "standard"

include = ["tests"]
extraPaths = ["scripts"]

exclude = [
    "dist",
    "build",
    ".venv",
    "**/__pycache__",
]

# ── Target ──────────────────────────────────────────────────────────────
pythonVersion = "3.14"
pythonPlatform = "Windows"

# ── Type evaluation — maximum precision ─────────────────────────────────
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
analyzeUnannotatedFunctions = true
strictParameterNoneValue = true
useLibraryCodeForTypes = true
deprecateTypingAliases = true
disableBytesTypePromotions = true
enableReachabilityAnalysis = true

# ── Global diagnostics ──────────────────────────────────────────────────
# Standard mode already catches argument‑type mismatches, optional‑access
# errors, return‑type violations, and most real bugs. The extras below are
# noiseless checks that spot rot without any false positives.
reportUnusedImport = "error"
reportDeprecated   = "error"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Keep the repository's established rule set explicit across Ruff releases.
# New Ruff versions may expand the implicit default set; enabling only the
# default checks used before this upgrade avoids unrelated whole-tree churn.
select = [
    "E4",   # pycodestyle errors — Ruff's established defaults
    "E7",
    "E9",
    "F",    # Pyflakes — Ruff's established defaults
    "UP",   # pyupgrade — modern syntax for 3.14
    "I",    # isort — consistent import ordering
    "B",    # flake8-bugbear — bug detection
    "RUF",  # ruff-specific — noqa validation etc.
    "PERF", # perflint — performance patterns
    "SIM",  # flake8-simplify — simplify expressions
    "C4",   # flake8-comprehensions — prefer comprehensions
    "ARG",  # flake8-unused-arguments — catch dead params
    "RET",  # flake8-return — return consistency
]
ignore = [
    "RUF001", # ambiguous‑unicode in strings — Vietnamese chars are legitimate
    "RUF002", # ambiguous‑unicode in docstrings
    "RUF003", # ambiguous‑unicode in comments
    "RUF009", # function call in dataclass default — Microseconds(n) is a NewType, fine
    "RUF012", # mutable class default is intentional in the tooling configuration
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ARG"]          # utility scripts — unused params are expected
"tests/*" = ["ARG", "SIM115"]  # test fixtures: unused params, contextlib patterns

[tool.pytest.ini_options]
# Markers let local and CI verification select narrow slices:
# `pytest -m scheduler` for scheduler-only runs, `pytest -m "not slow"` for fast lanes.
testpaths   = ["tests"]
addopts     = "--basetemp=.pytest_tmp -ra --strict-markers"
markers = [
    "scheduler: pure-domain scheduling tests (no real Windows API)",
    "windows:   requires Windows or SendInput — opt in on runners that support it",
    "golden:    snapshot regressions against golden_schedules / golden_engine_timeline",
    "slow:      wall-clock benchmarks — skip on fast lane",
]
norecursedirs = [
    "golden_schedules",
    "perf-baselines",
    ".tmp",
]
