[package]
name = "sky_xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
base64 = "=0.23.1"
getrandom.workspace = true
ico = "0.6"
minisign-verify = "=0.3.0"
roxmltree = "0.21.1"
semver = "=1.0.28"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sky_app_core.workspace = true
sky_windows_security.workspace = true
toml = "1.1.8"
url = "2.5.8"
walkdir = "2.5"
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }
